[package]
name = "deve_core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
anyhow.workspace = true
tracing.workspace = true
uuid.workspace = true
toml = "0.5"
unicode-normalization = "0.1"
smol_str.workspace = true
smallvec.workspace = true
ropey = "1.6"
regex.workspace = true
chrono.workspace = true
dissimilar = "1.0.10"
similar = "2.7.0"
rhai = { version = "1.19", features = ["serde", "sync"] }
ed25519-dalek = "2.2.0"
rand = "0.8.5"
sha2 = "0.10.9"
aes-gcm = "0.10.3"
hex = "0.4.3"
config = "0.15"
dotenvy = "0.15"
postcard = { version = "1.1.3", default-features = false, features = ["alloc"] }
argon2 = "0.5.3"
ignore = "0.4.27"
walkdir = "2.5.0"

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { workspace = true }
getrandom_02 = { workspace = true }
uuid = { version = "1.8.0", features = ["v4", "js"] } 

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
jsonwebtoken = "9.3"
redb.workspace = true
walkdir = "2.5.0"
notify = "8.2.0"
notify-debouncer-full = "0.7.0"
file-id = "0.2.3"
crossbeam-channel = "0.5.15"
notify-debouncer-mini = "0.7.0"
tempfile = "3.10"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[features]
default = []
search = ["tantivy"]

[target.'cfg(not(target_arch = "wasm32"))'.dependencies.tantivy]
version = "0.26"
optional = true

[dev-dependencies]
criterion.workspace = true

[[bench]]
name = "sync_bench"
harness = false
