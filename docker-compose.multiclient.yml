# Deve-Notebook Docker multi-client smoke compose.
# Local-only test entry: build the Dockerfile, run one server, and let
# Playwright attach multiple isolated browser contexts from the host.

services:
  deve-server:
    image: ${DEVE_DOCKER_MULTI_IMAGE:-deve-notebook:local-multiclient}
    build:
      context: .
      dockerfile: Dockerfile
    restart: "no"
    ports:
      - "${DEVE_DOCKER_MULTI_PORT:-3101}:3001"
    volumes:
      - deve-multiclient-data:/data
      - deve-multiclient-notes:/notes
    environment:
      DEVE_BIND_ADDR: 0.0.0.0:3001
      DEVE_LEDGER_DIR: /data/ledger
      AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET to at least 32 random bytes}
      AUTH_USER: ${AUTH_USER:-admin}
      AUTH_PASS: ${AUTH_PASS:?set AUTH_PASS to an Argon2 PHC password hash}
    mem_limit: 512m
    deploy:
      resources:
        limits:
          memory: 512m
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:3001/api/node/role"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

volumes:
  deve-multiclient-data: {}
  deve-multiclient-notes: {}
