name: Native Target Host

on:
  workflow_dispatch:
    inputs:
      target:
        description: Target host validation to run.
        type: choice
        default: all
        options:
          - all
          - desktop-macos
          - desktop-windows
          - mobile-android
          - mobile-ios
      required_preflight:
        description: Fail closed when target-host prerequisites are missing.
        type: boolean
        default: false
      run_desktop_package_build:
        description: Run Desktop package build after preflight.
        type: boolean
        default: false
      run_desktop_startup_smoke:
        description: Run Desktop packaged binary startup smoke after package build.
        type: boolean
        default: false
      run_desktop_installer_smoke:
        description: Run Desktop installer install/uninstall smoke after package build.
        type: boolean
        default: false
      run_desktop_remote_browser_smoke:
        description: Run installed Desktop RemoteBrowser and native local recovery smoke.
        type: boolean
        default: false
      desktop_remote_https_origin:
        description: Exact temporary HTTPS Deve origin for Desktop RemoteBrowser smoke.
        type: string
        default: ""
      desktop_remote_username:
        description: Temporary Desktop RemoteBrowser smoke username.
        type: string
        default: ""
      desktop_remote_head_proof_url:
        description: Same-origin HTTPS endpoint whose body is the exact candidate commit SHA (external override only).
        type: string
        default: ""
      run_mobile_android_package_build:
        description: Run Mobile Android shell-only package build after preflight.
        type: boolean
        default: false
      run_mobile_android_install_startup_smoke:
        description: Run Mobile Android emulator install/startup smoke after package build.
        type: boolean
        default: false
      run_mobile_android_remote_browser_smoke:
        description: Also run Android RemoteBrowser writable lifecycle and native local recovery.
        type: boolean
        default: false
      mobile_android_remote_https_origin:
        description: Exact temporary HTTPS Deve origin for Android RemoteBrowser smoke.
        type: string
        default: ""
      mobile_android_remote_username:
        description: Temporary Android RemoteBrowser smoke username.
        type: string
        default: ""
      mobile_android_remote_head_proof_url:
        description: Same-origin HTTPS endpoint whose body is the exact candidate commit SHA (external override only).
        type: string
        default: ""
      run_mobile_ios_package_build:
        description: Run Mobile iOS shell-only package build after preflight.
        type: boolean
        default: false
      run_mobile_ios_install_startup_smoke:
        description: Run Mobile iOS simulator install/startup smoke after package build.
        type: boolean
        default: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  desktop-macos:
    if: ${{ inputs.target == 'all' || inputs.target == 'desktop-macos' }}
    runs-on: macos-latest
    env:
      DEVE_DESKTOP_TARGET_HOST_PREFLIGHT_REQUIRED: ${{ inputs.required_preflight && '1' || '0' }}
      DEVE_DESKTOP_TARGET_HOSTS: macos
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_PROVIDER_SHORT_NAME: ${{ secrets.APPLE_PROVIDER_SHORT_NAME }}
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust 1.92
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.92
          targets: wasm32-unknown-unknown,aarch64-apple-darwin,x86_64-apple-darwin

      - name: Install Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install native target-host tools
        env:
          DEVE_NATIVE_INSTALL_TRUNK: "1"
          DEVE_NATIVE_INSTALL_TAURI_CLI: ${{ inputs.run_desktop_package_build && '1' || '0' }}
        run: |
          scripts/install-native-target-host-tools.sh

      - name: Build web dist
        run: scripts/build-web-dist-ci.sh

      - name: Desktop macOS target-host preflight
        id: desktop_macos_preflight
        env:
          DEVE_DESKTOP_PACKAGE_NO_SIGN: "1"
        run: scripts/check-desktop-target-host-preflight.sh

      - name: Native process adapter gate remains closed
        id: desktop_macos_process_gate
        run: scripts/check-native-process-adapter-gate.sh

      - name: Reject Desktop macOS startup smoke without package build
        id: desktop_macos_invalid_startup_request
        if: ${{ ! inputs.run_desktop_package_build && inputs.run_desktop_startup_smoke }}
        run: |
          echo "Desktop macOS startup/native-session smoke requires run_desktop_package_build=true."
          exit 1

      - name: Reject Desktop macOS installer smoke without package build
        id: desktop_macos_invalid_installer_request
        if: ${{ ! inputs.run_desktop_package_build && inputs.run_desktop_installer_smoke }}
        run: |
          echo "Desktop macOS installer smoke requires run_desktop_package_build=true."
          exit 1

      - name: Desktop macOS package build
        id: desktop_macos_package_build
        if: ${{ inputs.run_desktop_package_build && ! inputs.run_desktop_startup_smoke }}
        env:
          DEVE_DESKTOP_PACKAGE_BUILD_REQUIRED: "1"
          DEVE_DESKTOP_PACKAGE_BUNDLES: app,dmg
          DEVE_DESKTOP_PACKAGE_NO_SIGN: "1"
        run: scripts/check-desktop-platform-package-build.sh

      - name: Desktop macOS target-host acceptance producer
        id: desktop_macos_acceptance
        if: ${{ inputs.run_desktop_package_build && inputs.run_desktop_startup_smoke }}
        run: >-
          cargo run --locked -p deve_baseline -- acceptance-run
          --tier target-host
          --producer desktop.macos-target-host
          --receipt-dir "${{ runner.temp }}/deve-acceptance-desktop-macos"

      - name: Desktop macOS installer install/uninstall smoke
        id: desktop_macos_installer_smoke
        if: ${{ inputs.run_desktop_package_build && inputs.run_desktop_installer_smoke }}
        env:
          DEVE_DESKTOP_INSTALLER_SMOKE_REQUIRED: "1"
          DEVE_DESKTOP_PACKAGE_BUNDLES: app,dmg
        run: scripts/check-desktop-installer-smoke.sh

      - name: Upload Desktop macOS package artifacts
        if: ${{ inputs.run_desktop_package_build }}
        uses: actions/upload-artifact@v7
        with:
          name: deve-desktop-macos-packages
          path: target/release/bundle/**
          if-no-files-found: error

      - name: Upload Desktop macOS acceptance receipts
        if: ${{ always() && inputs.run_desktop_package_build && inputs.run_desktop_startup_smoke }}
        uses: actions/upload-artifact@v7
        with:
          name: deve-acceptance-receipts-desktop-macos
          path: ${{ runner.temp }}/deve-acceptance-desktop-macos
          if-no-files-found: error

      - name: Write Desktop macOS target-host evidence
        if: always()
        env:
          DEVE_NATIVE_TARGET_HOST_EVIDENCE_TARGET: Desktop macOS
          DEVE_NATIVE_TARGET_HOST_EVIDENCE_OUT: target/native-target-host-evidence/desktop-macos.md
          DEVE_NATIVE_TARGET_HOST_EVIDENCE_COMMANDS: |
            scripts/check-desktop-target-host-preflight.sh
            scripts/check-native-process-adapter-gate.sh
            DEVE_DESKTOP_PACKAGE_BUILD_REQUIRED=1 DEVE_DESKTOP_PACKAGE_BUNDLES=app,dmg DEVE_DESKTOP_PACKAGE_NO_SIGN=1 scripts/check-desktop-platform-package-build.sh
            DEVE_DESKTOP_STARTUP_SMOKE_REQUIRED=1 DEVE_DESKTOP_PACKAGE_BUNDLES=app,dmg scripts/check-desktop-package-startup-smoke.sh
            DEVE_DESKTOP_NATIVE_SESSION_SMOKE_REQUIRED=1 DEVE_DESKTOP_PACKAGE_BUNDLES=app,dmg scripts/check-desktop-native-session-package-smoke.sh
            DEVE_DESKTOP_INSTALLER_SMOKE_REQUIRED=1 DEVE_DESKTOP_PACKAGE_BUNDLES=app,dmg scripts/check-desktop-installer-smoke.sh
          DEVE_NATIVE_TARGET_HOST_EVIDENCE_COMMAND_RESULTS: |
            desktop_preflight=${{ steps.desktop_macos_preflight.outcome }}
            process_gate=${{ steps.desktop_macos_process_gate.outcome }}
            invalid_startup_request=${{ inputs.run_desktop_startup_smoke && ! inputs.run_desktop_package_build && steps.desktop_macos_invalid_startup_request.outcome || 'skipped' }}
            invalid_installer_request=${{ inputs.run_desktop_installer_smoke && ! inputs.run_desktop_package_build && steps.desktop_macos_invalid_installer_request.outcome || 'skipped' }}
            package_build=${{ inputs.run_desktop_package_build && inputs.run_desktop_startup_smoke && steps.desktop_macos_acceptance.outcome || inputs.run_desktop_package_build && steps.desktop_macos_package_build.outcome || 'skipped' }}
            startup_smoke=${{ inputs.run_desktop_package_build && inputs.run_desktop_startup_smoke && steps.desktop_macos_acceptance.outcome || 'skipped' }}
            native_session_smoke=${{ inputs.run_desktop_package_build && inputs.run_desktop_startup_smoke && steps.desktop_macos_acceptance.outcome || 'skipped' }}
            installer_smoke=${{ inputs.run_desktop_package_build && inputs.run_desktop_installer_smoke && steps.desktop_macos_installer_smoke.outcome || 'skipped' }}
          DEVE_NATIVE_TARGET_HOST_EVIDENCE_ARTIFACTS: ${{ inputs.run_desktop_package_build && 'target/release/bundle/**' || 'N/A - Desktop package build was not requested' }}
          DEVE_NATIVE_TARGET_HOST_EVIDENCE_INSTALL_RESULT: ${{ inputs.run_desktop_package_build && inputs.run_desktop_installer_smoke && steps.desktop_macos_installer_smoke.outcome || inputs.run_desktop_installer_smoke && 'skipped - package build was not requested' || 'N/A - installer execution was not requested' }}
          DEVE_NATIVE_TARGET_HOST_EVIDENCE_STARTUP_RESULT: ${{ inputs.run_desktop_package_build && inputs.run_desktop_startup_smoke && steps.desktop_macos_acceptance.outcome || 'N/A - startup smoke was not requested' }}
          DEVE_NATIVE_TARGET_HOST_EVIDENCE_CONCLUSION: ${{ inputs.run_desktop_package_build && inputs.run_desktop_installer_smoke && 'package build and installer smoke attempted; inspect job result and artifacts before declaring installer readiness' || inputs.run_desktop_package_build && inputs.run_desktop_startup_smoke && 'package build and startup smoke attempted; installer readiness not requested' || inputs.run_desktop_package_build && 'package build attempted; inspect job result and artifacts before declaring readiness' || 'diagnostic-only' }}
        run: scripts/write-native-target-host-evidence.sh

      - name: Upload Desktop macOS target-host evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: deve-native-target-host-evidence-macos
          path: |
            target/native-target-host-evidence/desktop-macos.md
            target/desktop-installer-smoke/**
          if-no-files-found: error

  desktop-windows:
    if: ${{ inputs.target == 'all' || inputs.target == 'desktop-windows' }}
    runs-on: windows-latest
    env:
      DEVE_DESKTOP_TARGET_HOST_PREFLIGHT_REQUIRED: ${{ inputs.required_preflight && '1' || '0' }}
      DEVE_DESKTOP_TARGET_HOSTS: windows
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust 1.92
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.92
          targets: wasm32-unknown-unknown,x86_64-pc-windows-msvc,aarch64-pc-windows-msvc

      - name: Install Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install native target-host tools
        env:
          DEVE_NATIVE_INSTALL_TRUNK: "1"
          DEVE_NATIVE_INSTALL_TAURI_CLI: ${{ inputs.run_desktop_package_build && '1' || '0' }}
        run: |
          scripts/install-native-target-host-tools.sh

      - name: Install Windows installer tools
        if: ${{ inputs.run_desktop_package_build }}
        shell: pwsh
        run: |
          $nsis = "${env:ProgramFiles(x86)}\NSIS"
          if (!(Test-Path "$nsis\makensis.exe")) {
            choco install nsis -y --no-progress
          }
          if (!(Test-Path "$nsis\makensis.exe")) {
            throw "NSIS makensis.exe was not installed at $nsis"
          }
          Add-Content -Path $env:GITHUB_PATH -Value $nsis

      - name: Build web dist
        run: scripts/build-web-dist-ci.sh

      - name: Desktop Windows target-host preflight
        id: desktop_windows_preflight
        run: scripts/check-desktop-target-host-preflight.sh

      - name: Native process adapter gate remains closed
        id: desktop_windows_process_gate
        run: scripts/check-native-process-adapter-gate.sh

      - name: Desktop RemoteBrowser fixture regressions
        shell: pwsh
        run: |
          pwsh -NoProfile -File scripts/desktop-install-root.test.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Desktop install-root regression failed' }
          pwsh -NoProfile -File scripts/remote-browser-fixture.test.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Desktop RemoteBrowser fixture regression failed' }
          node --test scripts/smoke-desktop-remote-browser.test.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Desktop RemoteBrowser source regression failed' }

      - name: Reject Desktop Windows startup smoke without package build
        id: desktop_windows_invalid_startup_request
        if: ${{ ! inputs.run_desktop_package_build && inputs.run_desktop_startup_smoke }}
        run: |
          echo "Desktop Windows startup/native-session smoke requires run_desktop_package_build=true."
          exit 1

      - name: Reject Desktop Windows installer smoke without package build
        id: desktop_windows_invalid_installer_request
        if: ${{ ! inputs.run_desktop_package_build && inputs.run_desktop_installer_smoke }}
        run: |
          echo "Desktop Windows installer smoke requires run_desktop_package_build=true."
          exit 1

      - name: Reject incomplete Desktop RemoteBrowser request
        if: ${{ inputs.run_desktop_remote_browser_smoke && (! inputs.run_desktop_package_build || ! inputs.run_desktop_installer_smoke) }}
        run: |
          echo "Desktop RemoteBrowser smoke requires package build and installer smoke. HTTPS credentials are optional paired overrides; otherwise the job creates an exact-HEAD fixture."
          exit 1

      - name: Desktop Windows package build
        id: desktop_windows_package_build
        if: ${{ inputs.run_desktop_package_build && ! inputs.run_desktop_installer_smoke }}
        env:
          DEVE_DESKTOP_PACKAGE_BUILD_REQUIRED: "1"
          DEVE_DESKTOP_PACKAGE_BUNDLES: msi,nsis
        run: scripts/check-desktop-platform-package-build.sh

      - name: Desktop Windows installed acceptance producer
        id: desktop_windows_installer_smoke
        if: ${{ inputs.run_desktop_package_build && inputs.run_desktop_installer_smoke }}
        run: >-
          cargo run --locked -p deve_baseline -- acceptance-run
          --tier target-host
          --producer desktop.local-backend
          --receipt-dir "${{ runner.temp }}/deve-acceptance-desktop-local"

      - name: Desktop Windows package startup smoke
        id: desktop_windows_startup_smoke
        if: ${{ inputs.run_desktop_package_build && inputs.run_desktop_startup_smoke }}
        env:
          DEVE_DESKTOP_STARTUP_SMOKE_REQUIRED: "1"
          DEVE_DESKTOP_PACKAGE_BUNDLES: msi,nsis
        run: scripts/check-desktop-package-startup-smoke.sh

      - name: Desktop Windows native session package smoke
        id: desktop_windows_native_session_smoke
        if: ${{ inputs.run_desktop_package_build && inputs.run_desktop_startup_smoke }}
        env:
          DEVE_DESKTOP_NATIVE_SESSION_SMOKE_REQUIRED: "1"
          DEVE_DESKTOP_PACKAGE_BUNDLES: msi,nsis
        run: scripts/check-desktop-native-session-package-smoke.sh


      - name: Upload Desktop Windows acceptance receipts
        if: ${{ always() && inputs.run_desktop_package_build && inputs.run_desktop_installer_smoke }}
        uses: actions/upload-artifact@v7
        with:
          name: deve-acceptance-receipts-desktop-local
          path: ${{ runner.temp }}/deve-acceptance-desktop-local
          if-no-files-found: error

      - name: Install isolated Desktop candidate for RemoteBrowser
        if: ${{ inputs.run_desktop_remote_browser_smoke && inputs.run_desktop_package_build && inputs.run_desktop_installer_smoke }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installers = @(Get-ChildItem target/release/bundle/nsis -Filter *.exe -File)
          if ($installers.Count -ne 1) { throw "expected exactly one NSIS installer, found $($installers.Count)" }
          $installRoot = Join-Path $env:RUNNER_TEMP 'deve-desktop-remote-installed'
          $workRoot = Join-Path $env:RUNNER_TEMP 'deve-desktop-remote-work'
          Remove-Item -LiteralPath $installRoot -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item -LiteralPath $workRoot -Recurse -Force -ErrorAction SilentlyContinue
          $process = Start-Process -FilePath $installers[0].FullName -ArgumentList @('/S', "/D=$installRoot") -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "NSIS install failed with exit code $($process.ExitCode)" }
          $marker = @{ schema = 1; marker = 'deve-desktop-remote-browser-smoke' } | ConvertTo-Json -Compress
          [System.IO.File]::WriteAllText(
            (Join-Path $installRoot '.deve-desktop-install-root.json'),
            $marker,
            [System.Text.UTF8Encoding]::new($false)
          )
          $binaries = @(Get-ChildItem $installRoot -Recurse -File | Where-Object { $_.Name -in @('deve_desktop.exe', 'Deve Notebook.exe') })
          if ($binaries.Count -ne 1) { throw "expected exactly one installed Desktop binary, found $($binaries.Count)" }
          "DEVE_DESKTOP_BINARY=$($binaries[0].FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "DEVE_DESKTOP_REMOTE_WORK_ROOT=$workRoot" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "DEVE_DESKTOP_REMOTE_INSTALL_ROOT=$installRoot" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Prepare Desktop RemoteBrowser HTTPS fixture
        id: desktop_remote_fixture
        if: ${{ inputs.run_desktop_remote_browser_smoke && inputs.run_desktop_package_build && inputs.run_desktop_installer_smoke }}
        shell: pwsh
        env:
          EXTERNAL_ORIGIN: ${{ inputs.desktop_remote_https_origin }}
          EXTERNAL_USERNAME: ${{ inputs.desktop_remote_username }}
          EXTERNAL_HEAD_PROOF_URL: ${{ inputs.desktop_remote_head_proof_url }}
          EXTERNAL_PASSWORD: ${{ secrets.DEVE_DESKTOP_REMOTE_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'
          function Assert-NoControl([string]$Value, [string]$Label) {
            if ($Value.IndexOfAny([char[]]"`r`n`0") -ge 0) { throw "$Label contains a forbidden control character" }
          }
          $externalValues = @($env:EXTERNAL_ORIGIN, $env:EXTERNAL_USERNAME, $env:EXTERNAL_HEAD_PROOF_URL)
          $externalCount = @($externalValues | Where-Object { -not [string]::IsNullOrEmpty($_) }).Count
          if ($externalCount -ne 0 -and $externalCount -ne 3) {
            throw 'Desktop RemoteBrowser external override requires origin, username, and same-origin HEAD proof URL together'
          }
          foreach ($entry in @(
            @($env:EXTERNAL_ORIGIN, 'origin'), @($env:EXTERNAL_USERNAME, 'username'),
            @($env:EXTERNAL_HEAD_PROOF_URL, 'HEAD proof URL'), @($env:EXTERNAL_PASSWORD, 'password')
          )) { Assert-NoControl $entry[0] $entry[1] }

          $stateRoot = Join-Path $env:RUNNER_TEMP 'deve-desktop-remote-fixture'
          if ($externalCount -eq 3) {
            $sourceKind = 'external'
            if (-not $env:EXTERNAL_PASSWORD) { throw 'Desktop RemoteBrowser external override requires DEVE_DESKTOP_REMOTE_PASSWORD' }
            Write-Output "::add-mask::$env:EXTERNAL_USERNAME"
            Write-Output "::add-mask::$env:EXTERNAL_PASSWORD"
            $externalCredentials = Join-Path $env:RUNNER_TEMP 'deve-desktop-external-credentials.json'
            try {
              @{ username = $env:EXTERNAL_USERNAME; password = $env:EXTERNAL_PASSWORD } |
                ConvertTo-Json | Set-Content -LiteralPath $externalCredentials -Encoding utf8
              $envFile = & pwsh -NoProfile -File scripts/remote-browser-fixture.ps1 start `
                --state-dir $stateRoot `
                --expected-head $env:GITHUB_SHA `
                --external-origin $env:EXTERNAL_ORIGIN `
                --external-head-proof-url $env:EXTERNAL_HEAD_PROOF_URL `
                --external-credentials-file $externalCredentials
            } finally {
              Remove-Item -LiteralPath $externalCredentials -Force -ErrorAction SilentlyContinue
            }
          } else {
            $sourceKind = 'internal'
            cargo build --locked -p deve_baseline
            if ($LASTEXITCODE -ne 0) { throw 'failed to build fixture password hasher' }
            $headProof = Join-Path $env:RUNNER_TEMP 'deve-desktop-backend-head.txt'
            [System.IO.File]::WriteAllText($headProof, $env:GITHUB_SHA, [System.Text.UTF8Encoding]::new($false))
            $envFile = & pwsh -NoProfile -File scripts/remote-browser-fixture.ps1 start `
              --state-dir $stateRoot `
              --expected-head $env:GITHUB_SHA `
              --backend-executable (Resolve-Path target/release/deve_cli.exe).Path `
              --backend-head-file $headProof `
              --password-hasher (Resolve-Path target/debug/deve_baseline.exe).Path `
              --password-hasher-arg remote-fixture-password-hash
          }
          if ($LASTEXITCODE -ne 0) { throw 'failed to start Desktop RemoteBrowser fixture' }
          $fixture = Get-Content -Raw -LiteralPath $envFile.Trim() | ConvertFrom-Json
          $credentials = Get-Content -Raw -LiteralPath $fixture.credentials_file | ConvertFrom-Json
          Write-Output "::add-mask::$($credentials.username)"
          Write-Output "::add-mask::$($credentials.password)"
          if ($credentials.auth_secret) { Write-Output "::add-mask::$($credentials.auth_secret)" }
          "source_kind=$sourceKind" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Desktop Windows RemoteBrowser acceptance producer
        if: ${{ inputs.run_desktop_remote_browser_smoke && inputs.run_desktop_package_build && inputs.run_desktop_installer_smoke && steps.desktop_remote_fixture.outputs.source_kind == 'internal' }}
        shell: pwsh
        run: |
          $stateRoot = Join-Path $env:RUNNER_TEMP 'deve-desktop-remote-fixture'
          $fixture = Get-Content -Raw -LiteralPath (Join-Path $stateRoot 'fixture-env.json') | ConvertFrom-Json
          $credentials = Get-Content -Raw -LiteralPath $fixture.credentials_file | ConvertFrom-Json
          $env:DEVE_DESKTOP_REMOTE_HTTPS_ORIGIN = $fixture.https_origin
          $env:DEVE_DESKTOP_REMOTE_USERNAME = $credentials.username
          $env:DEVE_DESKTOP_REMOTE_PASSWORD = $credentials.password
          cargo run --locked -p deve_baseline -- acceptance-run `
            --tier target-host `
            --producer desktop.remote-browser `
            --receipt-dir "${{ runner.temp }}/deve-acceptance-desktop-remote"
          if ($LASTEXITCODE -ne 0) { throw 'Desktop RemoteBrowser acceptance producer failed' }

      - name: Desktop Windows external RemoteBrowser diagnostic
        if: ${{ inputs.run_desktop_remote_browser_smoke && inputs.run_desktop_package_build && inputs.run_desktop_installer_smoke && steps.desktop_remote_fixture.outputs.source_kind == 'external' }}
        shell: pwsh
        run: |
          $stateRoot = Join-Path $env:RUNNER_TEMP 'deve-desktop-remote-fixture'
          $fixture = Get-Content -Raw -LiteralPath (Join-Path $stateRoot 'fixture-env.json') | ConvertFrom-Json
          $credentials = Get-Content -Raw -LiteralPath $fixture.credentials_file | ConvertFrom-Json
          $env:DEVE_DESKTOP_REMOTE_HTTPS_ORIGIN = $fixture.https_origin
          $env:DEVE_DESKTOP_REMOTE_USERNAME = $credentials.username
          $env:DEVE_DESKTOP_REMOTE_PASSWORD = $credentials.password
          pwsh -NoProfile -File scripts/check-desktop-remote-browser-smoke.ps1 `
            -DesktopBinary $env:DEVE_DESKTOP_BINARY `
            -InstallRoot $env:DEVE_DESKTOP_REMOTE_INSTALL_ROOT `
            -WorkRoot $env:DEVE_DESKTOP_REMOTE_WORK_ROOT `
            -RemoteHttpsOrigin $env:DEVE_DESKTOP_REMOTE_HTTPS_ORIGIN `
            -Username $env:DEVE_DESKTOP_REMOTE_USERNAME
          if ($LASTEXITCODE -ne 0) { throw 'Desktop external RemoteBrowser diagnostic failed' }

      - name: Stop Desktop RemoteBrowser HTTPS fixture
        if: ${{ always() && inputs.run_desktop_remote_browser_smoke }}
        shell: pwsh
        run: |
          $stateRoot = Join-Path $env:RUNNER_TEMP 'deve-desktop-remote-fixture'
          if (Test-Path -LiteralPath (Join-Path $stateRoot 'fixture-state.json') -PathType Leaf) {
            pwsh -NoProfile -File scripts/remote-browser-fixture.ps1 stop --state-dir $stateRoot
            if ($LASTEXITCODE -ne 0) { throw 'Desktop RemoteBrowser fixture cleanup failed' }
          }

      - name: Uninstall isolated Desktop RemoteBrowser candidate
        if: ${{ always() && inputs.run_desktop_remote_browser_smoke }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrEmpty($env:DEVE_DESKTOP_REMOTE_INSTALL_ROOT) -or !(Test-Path -LiteralPath $env:DEVE_DESKTOP_REMOTE_INSTALL_ROOT)) { exit 0 }
          $uninstallers = @(Get-ChildItem $env:DEVE_DESKTOP_REMOTE_INSTALL_ROOT -Recurse -File | Where-Object { $_.Name -match '^(uninstall|unins.*)\.exe$' })
          if ($uninstallers.Count -ne 1) { throw "expected exactly one RemoteBrowser uninstaller, found $($uninstallers.Count)" }
          $markerPath = Join-Path $env:DEVE_DESKTOP_REMOTE_INSTALL_ROOT '.deve-desktop-install-root.json'
          if (-not (Test-Path -LiteralPath $markerPath -PathType Leaf)) { throw 'validated install-root marker is missing before uninstall' }
          Remove-Item -LiteralPath $markerPath -Force
          $process = Start-Process -FilePath $uninstallers[0].FullName -ArgumentList '/S' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "RemoteBrowser uninstall failed with exit code $($process.ExitCode)" }
          if (Test-Path -LiteralPath $env:DEVE_DESKTOP_REMOTE_INSTALL_ROOT) { throw 'RemoteBrowser install root remains after uninstall' }

      - name: Upload Desktop Windows RemoteBrowser receipts
        if: ${{ always() && inputs.run_desktop_remote_browser_smoke && steps.desktop_remote_fixture.outputs.source_kind == 'internal' }}
        uses: actions/upload-artifact@v7
        with:
          name: deve-acceptance-receipts-desktop-remote
          path: ${{ runner.temp }}/deve-acceptance-desktop-remote
          if-no-files-found: error

      - name: Upload Desktop Windows package artifacts
        if: ${{ inputs.run_desktop_package_build }}
        uses: actions/upload-artifact@v7
        with:
          name: deve-desktop-windows-packages
          path: target/release/bundle/**
          if-no-files-found: error

      - name: Write Desktop Windows target-host evidence
        if: always()
        env:
          DEVE_NATIVE_TARGET_HOST_EVIDENCE_TARGET: Desktop Windows
          DEVE_NATIVE_TARGET_HOST_EVIDENCE_OUT: target/native-target-host-evidence/desktop-windows.md
          DEVE_NATIVE_TARGET_HOST_EVIDENCE_COMMANDS: |
            scripts/check-desktop-target-host-preflight.sh
            scripts/check-native-process-adapter-gate.sh
            DEVE_DESKTOP_PACKAGE_BUILD_REQUIRED=1 DEVE_DESKTOP_PACKAGE_BUNDLES=msi,nsis scripts/check-desktop-platform-package-build.sh
            DEVE_DESKTOP_STARTUP_SMOKE_REQUIRED=1 DEVE_DESKTOP_PACKAGE_BUNDLES=msi,nsis scripts/check-desktop-package-startup-smoke.sh
            DEVE_DESKTOP_NATIVE_SESSION_SMOKE_REQUIRED=1 DEVE_DESKTOP_PACKAGE_BUNDLES=msi,nsis scripts/check-desktop-native-session-package-smoke.sh
            DEVE_DESKTOP_INSTALLER_SMOKE_REQUIRED=1 DEVE_DESKTOP_PACKAGE_BUNDLES=msi,nsis scripts/check-desktop-installer-smoke.sh
          DEVE_NATIVE_TARGET_HOST_EVIDENCE_COMMAND_RESULTS: |
            desktop_preflight=${{ steps.desktop_windows_preflight.outcome }}
            process_gate=${{ steps.desktop_windows_process_gate.outcome }}
            invalid_startup_request=${{ inputs.run_desktop_startup_smoke && ! inputs.run_desktop_package_build && steps.desktop_windows_invalid_startup_request.outcome || 'skipped' }}
            invalid_installer_request=${{ inputs.run_desktop_installer_smoke && ! inputs.run_desktop_package_build && steps.desktop_windows_invalid_installer_request.outcome || 'skipped' }}
            package_build=${{ inputs.run_desktop_package_build && inputs.run_desktop_installer_smoke && steps.desktop_windows_installer_smoke.outcome || inputs.run_desktop_package_build && steps.desktop_windows_package_build.outcome || 'skipped' }}
            startup_smoke=${{ inputs.run_desktop_package_build && inputs.run_desktop_startup_smoke && steps.desktop_windows_startup_smoke.outcome || 'skipped' }}
            native_session_smoke=${{ inputs.run_desktop_package_build && inputs.run_desktop_startup_smoke && steps.desktop_windows_native_session_smoke.outcome || 'skipped' }}
            installer_smoke=${{ inputs.run_desktop_package_build && inputs.run_desktop_installer_smoke && steps.desktop_windows_installer_smoke.outcome || 'skipped' }}
          DEVE_NATIVE_TARGET_HOST_EVIDENCE_ARTIFACTS: ${{ inputs.run_desktop_package_build && 'target/release/bundle/**' || 'N/A - Desktop package build was not requested' }}
          DEVE_NATIVE_TARGET_HOST_EVIDENCE_INSTALL_RESULT: ${{ inputs.run_desktop_package_build && inputs.run_desktop_installer_smoke && steps.desktop_windows_installer_smoke.outcome || inputs.run_desktop_installer_smoke && 'skipped - package build was not requested' || 'N/A - installer execution was not requested' }}
          DEVE_NATIVE_TARGET_HOST_EVIDENCE_STARTUP_RESULT: ${{ inputs.run_desktop_package_build && inputs.run_desktop_startup_smoke && steps.desktop_windows_startup_smoke.outcome || 'N/A - startup smoke was not requested' }}
          DEVE_NATIVE_TARGET_HOST_EVIDENCE_CONCLUSION: ${{ inputs.run_desktop_package_build && inputs.run_desktop_installer_smoke && 'package build and installer smoke attempted; inspect job result and artifacts before declaring installer readiness' || inputs.run_desktop_package_build && inputs.run_desktop_startup_smoke && 'package build and startup smoke attempted; installer readiness not requested' || inputs.run_desktop_package_build && 'package build attempted; inspect job result and artifacts before declaring readiness' || 'diagnostic-only' }}
        run: scripts/write-native-target-host-evidence.sh

      - name: Upload Desktop Windows target-host evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: deve-native-target-host-evidence-windows
          path: |
            target/native-target-host-evidence/desktop-windows.md
            target/desktop-installer-smoke/**
          if-no-files-found: error

  mobile-android:
    if: ${{ inputs.target == 'all' || inputs.target == 'mobile-android' }}
    runs-on: ubuntu-latest
    env:
      DEVE_MOBILE_PACKAGE_PREFLIGHT_REQUIRED: ${{ (inputs.required_preflight || inputs.run_mobile_android_package_build) && '1' || '0' }}
      DEVE_MOBILE_PACKAGE_TARGETS: android
      DEVE_MOBILE_PACKAGE_HOST_NATIVE_PACKAGING_CHECK: "0"
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust 1.92
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.92
          targets: wasm32-unknown-unknown,aarch64-linux-android,x86_64-linux-android

      - name: Install Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Install Android SDK platform tools
        run: |
          test -n "${ANDROID_HOME:-}"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/emulator" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          export PATH="$ANDROID_HOME/platform-tools:$ANDROID_HOME/emulator:$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "emulator"

      - name: Install native target-host tools
        env:
          DEVE_NATIVE_INSTALL_TRUNK: "1"
          DEVE_NATIVE_INSTALL_TAURI_CLI: "1"
        run: |
          scripts/install-native-target-host-tools.sh

      - name: Build web dist
        run: scripts/build-web-dist-ci.sh

      - name: Mobile Android target-host preflight
        id: mobile_android_preflight
        run: scripts/check-mobile-platform-package-preflight.sh

      - name: Native process adapter gate remains closed
        id: mobile_android_process_gate
        env:
          DEVE_NATIVE_PROCESS_ADAPTER_RUN_DESKTOP_NATIVE_PACKAGING_TESTS: "0"
        run: scripts/check-native-process-adapter-gate.sh

      - name: Linux RemoteBrowser fixture regressions
        run: |
          bash scripts/remote-browser-fixture.test.sh
          bash scripts/dispatch-native-target-host-workflow.test.sh

      - name: Reject Android install smoke without package build
        id: mobile_android_invalid_request
        if: ${{ ! inputs.run_mobile_android_package_build && inputs.run_mobile_android_install_startup_smoke }}
        run: |
          echo "Android install/startup smoke requires run_mobile_android_package_build=true."
          exit 1

      - name: Reject Android RemoteBrowser smoke without complete execution inputs
        if: ${{ inputs.run_mobile_android_remote_browser_smoke && (! inputs.run_mobile_android_package_build || ! inputs.run_mobile_android_install_startup_smoke || (inputs.mobile_android_remote_https_origin == '') != (inputs.mobile_android_remote_username == '')) }}
        run: |
          echo "Android RemoteBrowser smoke requires package build and install/startup; external override must provide both HTTPS origin and username."
          exit 1

      - name: Mobile Android shell package build (standalone)
        id: mobile_android_package_build
        if: ${{ inputs.run_mobile_android_package_build && ! inputs.run_mobile_android_install_startup_smoke }}
        env:
          DEVE_MOBILE_ANDROID_PACKAGE_BUILD_REQUIRED: "1"
        run: scripts/check-mobile-android-shell-package-build.sh

      - name: Enable Android emulator KVM access
        if: ${{ inputs.run_mobile_android_package_build && inputs.run_mobile_android_install_startup_smoke }}
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Mobile Android emulator install/startup smoke
        id: mobile_android_install_startup_smoke
        if: ${{ inputs.run_mobile_android_package_build && inputs.run_mobile_android_install_startup_smoke }}
        env:
          DEVE_MOBILE_ANDROID_PACKAGE_TARGET: x86_64
          DEVE_MOBILE_ANDROID_ADB_TIMEOUT_SECS: "120"
        run: >-
          cargo run --locked -p deve_baseline -- acceptance-run
          --tier target-host
          --producer android.local-backend
          --receipt-dir "${{ runner.temp }}/deve-acceptance-android-local"

      - name: Upload Mobile Android LocalBackend receipt
        if: ${{ always() && inputs.run_mobile_android_package_build && inputs.run_mobile_android_install_startup_smoke }}
        uses: actions/upload-artifact@v7
        with:
          name: deve-acceptance-receipts-android-local
          path: ${{ runner.temp }}/deve-acceptance-android-local
          if-no-files-found: error

      - name: Prepare Android RemoteBrowser HTTPS fixture
        id: android_remote_fixture
        if: ${{ inputs.run_mobile_android_package_build && inputs.run_mobile_android_install_startup_smoke && inputs.run_mobile_android_remote_browser_smoke }}
        env:
          EXTERNAL_ORIGIN: ${{ inputs.mobile_android_remote_https_origin }}
          EXTERNAL_USERNAME: ${{ inputs.mobile_android_remote_username }}
          EXTERNAL_HEAD_PROOF_URL: ${{ inputs.mobile_android_remote_head_proof_url }}
          EXTERNAL_PASSWORD: ${{ secrets.DEVE_MOBILE_ANDROID_REMOTE_PASSWORD }}
        run: |
          set -euo pipefail
          for value in "$EXTERNAL_ORIGIN" "$EXTERNAL_USERNAME" "$EXTERNAL_HEAD_PROOF_URL" "$EXTERNAL_PASSWORD"; do
            [[ "$value" != *$'\n'* && "$value" != *$'\r'* ]] || { echo 'Android external override contains a forbidden control character' >&2; exit 1; }
          done
          external_count=0
          for value in "$EXTERNAL_ORIGIN" "$EXTERNAL_USERNAME" "$EXTERNAL_HEAD_PROOF_URL"; do [[ -z "$value" ]] || external_count=$((external_count + 1)); done
          [[ "$external_count" == 0 || "$external_count" == 3 ]] || { echo 'Android external override requires origin, username, and same-origin HEAD proof URL together' >&2; exit 1; }

          state_root="$RUNNER_TEMP/deve-android-remote-fixture"
          if [[ "$external_count" == 3 ]]; then
            source_kind=external
            [[ -n "$EXTERNAL_PASSWORD" ]] || { echo 'Android external override requires DEVE_MOBILE_ANDROID_REMOTE_PASSWORD' >&2; exit 1; }
            echo "::add-mask::$EXTERNAL_USERNAME"
            echo "::add-mask::$EXTERNAL_PASSWORD"
            external_credentials="$RUNNER_TEMP/deve-android-external-credentials.json"
            trap 'rm -f -- "$external_credentials"' EXIT
            node - "$external_credentials" "$EXTERNAL_USERNAME" "$EXTERNAL_PASSWORD" <<'NODE'
          const fs = require("fs");
          fs.writeFileSync(process.argv[2], JSON.stringify({username: process.argv[3], password: process.argv[4]}) + "\n", {mode: 0o600});
          NODE
            env_file="$(bash scripts/remote-browser-fixture.sh start \
              --state-dir "$state_root" \
              --expected-head "$GITHUB_SHA" \
              --external-origin "$EXTERNAL_ORIGIN" \
              --external-head-proof-url "$EXTERNAL_HEAD_PROOF_URL" \
              --external-credentials-file "$external_credentials")"
            rm -f -- "$external_credentials"
            trap - EXIT
          else
            source_kind=internal
            cargo build --locked --release -p deve_cli
            cargo build --locked -p deve_baseline
            head_proof="$RUNNER_TEMP/deve-android-backend-head.txt"
            printf '%s' "$GITHUB_SHA" >"$head_proof"
            env_file="$(bash scripts/remote-browser-fixture.sh start \
              --state-dir "$state_root" \
              --expected-head "$GITHUB_SHA" \
              --backend-executable "$GITHUB_WORKSPACE/target/release/deve_cli" \
              --backend-head-file "$head_proof" \
              --password-hasher "$GITHUB_WORKSPACE/target/debug/deve_baseline" \
              --password-hasher-arg remote-fixture-password-hash)"
          fi
          origin="$(jq -r .https_origin "$env_file")"
          credentials_file="$(jq -r .credentials_file "$env_file")"
          username="$(jq -r .username "$credentials_file")"
          password="$(jq -r .password "$credentials_file")"
          auth_secret="$(jq -r .auth_secret "$credentials_file")"
          echo "::add-mask::$username"
          echo "::add-mask::$password"
          [[ "$auth_secret" == "null" ]] || echo "::add-mask::$auth_secret"
          printf 'source_kind=%s\n' "$source_kind" >>"$GITHUB_OUTPUT"

      - name: Mobile Android RemoteBrowser acceptance producer
        if: ${{ inputs.run_mobile_android_package_build && inputs.run_mobile_android_install_startup_smoke && inputs.run_mobile_android_remote_browser_smoke && steps.android_remote_fixture.outputs.source_kind == 'internal' }}
        run: |
          set -euo pipefail
          state_root="$RUNNER_TEMP/deve-android-remote-fixture"
          fixture="$state_root/fixture-env.json"
          credentials_file="$(jq -r .credentials_file "$fixture")"
          export DEVE_MOBILE_ANDROID_REMOTE_HTTPS_ORIGIN="$(jq -r .https_origin "$fixture")"
          export DEVE_MOBILE_ANDROID_REMOTE_USERNAME="$(jq -r .username "$credentials_file")"
          export DEVE_MOBILE_ANDROID_REMOTE_PASSWORD="$(jq -r .password "$credentials_file")"
          cargo run --locked -p deve_baseline -- acceptance-run \
            --tier target-host \
            --producer android.remote-browser \
            --receipt-dir "${{ runner.temp }}/deve-acceptance-android-remote"

      - name: Mobile Android external RemoteBrowser diagnostic
        if: ${{ inputs.run_mobile_android_package_build && inputs.run_mobile_android_install_startup_smoke && inputs.run_mobile_android_remote_browser_smoke && steps.android_remote_fixture.outputs.source_kind == 'external' }}
        run: |
          set -euo pipefail
          state_root="$RUNNER_TEMP/deve-android-remote-fixture"
          fixture="$state_root/fixture-env.json"
          credentials_file="$(jq -r .credentials_file "$fixture")"
          export DEVE_MOBILE_ANDROID_REMOTE_HTTPS_ORIGIN="$(jq -r .https_origin "$fixture")"
          export DEVE_MOBILE_ANDROID_REMOTE_USERNAME="$(jq -r .username "$credentials_file")"
          export DEVE_MOBILE_ANDROID_REMOTE_PASSWORD="$(jq -r .password "$credentials_file")"
          export DEVE_MOBILE_ANDROID_EMULATOR_INSTALL_STARTUP_SMOKE_REQUIRED=1
          export DEVE_MOBILE_ANDROID_EMULATOR_JOURNEY=remote
          bash scripts/check-mobile-android-emulator-install-startup-smoke.sh

      - name: Stop Android RemoteBrowser HTTPS fixture
        if: ${{ always() && inputs.run_mobile_android_remote_browser_smoke }}
        run: |
          state_root="$RUNNER_TEMP/deve-android-remote-fixture"
          if [[ -f "$state_root/fixture-state.json" ]]; then
            bash scripts/remote-browser-fixture.sh stop --state-dir "$state_root"
          fi

      - name: Upload Mobile Android RemoteBrowser receipt
        if: ${{ always() && inputs.run_mobile_android_package_build && inputs.run_mobile_android_install_startup_smoke && inputs.run_mobile_android_remote_browser_smoke && steps.android_remote_fixture.outputs.source_kind == 'internal' }}
        uses: actions/upload-artifact@v7
        with:
          name: deve-acceptance-receipts-android-remote
          path: ${{ runner.temp }}/deve-acceptance-android-remote
          if-no-files-found: error

      - name: Mobile Android shell package build covered by emulator smoke
        id: mobile_android_package_build_via_emulator
        if: ${{ always() && inputs.run_mobile_android_package_build && inputs.run_mobile_android_install_startup_smoke }}
        run: |
          find apps/mobile/gen/android/app/build/outputs -type f \( -name '*.apk' -o -name '*.aab' \) -print -quit | grep -q .
          echo "Android shell package build was executed inside emulator install/startup smoke."

      - name: Upload Mobile Android package artifacts
        if: ${{ inputs.run_mobile_android_package_build }}
        uses: actions/upload-artifact@v7
        with:
          name: deve-mobile-android-packages
          path: |
            apps/mobile/gen/android/app/build/outputs/**/*.apk
            apps/mobile/gen/android/app/build/outputs/**/*.aab
          if-no-files-found: error

      - name: Write Mobile Android target-host evidence
        if: always()
        env:
          DEVE_NATIVE_TARGET_HOST_EVIDENCE_TARGET: Mobile Android
          DEVE_NATIVE_TARGET_HOST_EVIDENCE_OUT: target/native-target-host-evidence/mobile-android.md
          DEVE_NATIVE_TARGET_HOST_EVIDENCE_COMMANDS: |
            scripts/check-mobile-platform-package-preflight.sh
            scripts/check-native-process-adapter-gate.sh
            run_mobile_android_package_build=${{ inputs.run_mobile_android_package_build }}
            package_build_command=${{ inputs.run_mobile_android_package_build && inputs.run_mobile_android_install_startup_smoke && 'covered by emulator install/startup smoke: DEVE_MOBILE_ANDROID_PACKAGE_BUILD_REQUIRED=1 scripts/check-mobile-android-shell-package-build.sh' || inputs.run_mobile_android_package_build && 'DEVE_MOBILE_ANDROID_PACKAGE_BUILD_REQUIRED=1 scripts/check-mobile-android-shell-package-build.sh' || 'skipped' }}
            install_startup_command=${{ inputs.run_mobile_android_package_build && inputs.run_mobile_android_install_startup_smoke && 'DEVE_MOBILE_ANDROID_EMULATOR_INSTALL_STARTUP_SMOKE_REQUIRED=1 DEVE_MOBILE_ANDROID_PACKAGE_TARGET=x86_64 DEVE_MOBILE_ANDROID_ADB_TIMEOUT_SECS=120 scripts/check-mobile-android-emulator-install-startup-smoke.sh' || 'skipped' }}
          DEVE_NATIVE_TARGET_HOST_EVIDENCE_COMMAND_RESULTS: |
            mobile_android_preflight=${{ steps.mobile_android_preflight.outcome }}
            process_gate=${{ steps.mobile_android_process_gate.outcome }}
            invalid_request=${{ inputs.run_mobile_android_install_startup_smoke && ! inputs.run_mobile_android_package_build && steps.mobile_android_invalid_request.outcome || 'skipped' }}
            package_build=${{ inputs.run_mobile_android_package_build && inputs.run_mobile_android_install_startup_smoke && steps.mobile_android_package_build_via_emulator.outcome || inputs.run_mobile_android_package_build && steps.mobile_android_package_build.outcome || 'skipped' }}
            install_startup_smoke=${{ inputs.run_mobile_android_package_build && inputs.run_mobile_android_install_startup_smoke && steps.mobile_android_install_startup_smoke.outcome || inputs.run_mobile_android_install_startup_smoke && 'skipped - package build was not requested' || 'skipped' }}
          DEVE_NATIVE_TARGET_HOST_EVIDENCE_ARTIFACTS: ${{ inputs.run_mobile_android_package_build && 'apps/mobile/gen/android/app/build/outputs/**/*.{apk,aab}' || 'N/A - Android package execution remains closed' }}
          DEVE_NATIVE_TARGET_HOST_EVIDENCE_INSTALL_RESULT: ${{ inputs.run_mobile_android_package_build && inputs.run_mobile_android_install_startup_smoke && steps.mobile_android_install_startup_smoke.outcome || inputs.run_mobile_android_package_build && 'N/A - Android install smoke not requested by package execution gate' || 'N/A - Android package execution remains closed' }}
          DEVE_NATIVE_TARGET_HOST_EVIDENCE_STARTUP_RESULT: ${{ inputs.run_mobile_android_package_build && inputs.run_mobile_android_install_startup_smoke && steps.mobile_android_install_startup_smoke.outcome || inputs.run_mobile_android_package_build && 'N/A - Android emulator startup smoke not requested by package execution gate' || 'N/A - Android package execution remains closed' }}
          DEVE_NATIVE_TARGET_HOST_EVIDENCE_CONCLUSION: ${{ inputs.run_mobile_android_package_build && inputs.run_mobile_android_install_startup_smoke && 'Android shell package build and emulator install/startup smoke attempted; inspect job result and artifacts before declaring emulator readiness' || inputs.run_mobile_android_package_build && 'Android shell package build attempted; inspect job result and artifacts before declaring install readiness' || 'diagnostic-only - Android package execution remains closed' }}
        run: scripts/write-native-target-host-evidence.sh

      - name: Upload Mobile Android target-host evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: deve-native-target-host-evidence-android
          path: |
            target/native-target-host-evidence/mobile-android.md
            target/mobile-android-emulator-smoke/**
          if-no-files-found: error

  mobile-ios:
    if: ${{ inputs.target == 'all' || inputs.target == 'mobile-ios' }}
    runs-on: macos-latest
    env:
      DEVE_MOBILE_PACKAGE_PREFLIGHT_REQUIRED: ${{ (inputs.required_preflight || inputs.run_mobile_ios_package_build) && '1' || '0' }}
      DEVE_MOBILE_PACKAGE_TARGETS: ios
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust 1.92
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.92
          targets: wasm32-unknown-unknown,aarch64-apple-ios,aarch64-apple-ios-sim

      - name: Install Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install native target-host tools
        env:
          DEVE_NATIVE_INSTALL_TRUNK: "1"
          DEVE_NATIVE_INSTALL_TAURI_CLI: "1"
        run: |
          scripts/install-native-target-host-tools.sh

      - name: Build web dist
        run: scripts/build-web-dist-ci.sh

      - name: Mobile iOS target-host preflight
        id: mobile_ios_preflight
        run: scripts/check-mobile-platform-package-preflight.sh

      - name: Native process adapter gate remains closed
        id: mobile_ios_process_gate
        run: scripts/check-native-process-adapter-gate.sh

      - name: Mobile iOS shell package build
        id: mobile_ios_package_build
        if: ${{ inputs.run_mobile_ios_package_build && ! inputs.run_mobile_ios_install_startup_smoke }}
        env:
          DEVE_MOBILE_IOS_PACKAGE_BUILD_REQUIRED: "1"
          DEVE_MOBILE_IOS_PACKAGE_TARGET: aarch64-sim
        run: scripts/check-mobile-ios-shell-package-build.sh

      - name: Mobile iOS Simulator acceptance producer
        id: mobile_ios_acceptance
        if: ${{ inputs.run_mobile_ios_package_build && inputs.run_mobile_ios_install_startup_smoke }}
        run: >-
          cargo run --locked -p deve_baseline -- acceptance-run
          --tier target-host
          --producer ios.simulator-lifecycle
          --receipt-dir "${{ runner.temp }}/deve-acceptance-ios-simulator"

      - name: Keep iOS package execution closed
        id: mobile_ios_package_closed_gate
        if: ${{ ! inputs.run_mobile_ios_package_build }}
        run: |
          test ! -e apps/mobile/gen/apple
          echo "iOS package build remains closed because run_mobile_ios_package_build=false."

      - name: Upload Mobile iOS package artifacts
        if: ${{ inputs.run_mobile_ios_package_build }}
        uses: actions/upload-artifact@v7
        with:
          name: deve-mobile-ios-packages
          path: apps/mobile/gen/apple/**
          if-no-files-found: error

      - name: Upload Mobile iOS Simulator acceptance receipts
        if: ${{ always() && inputs.run_mobile_ios_package_build && inputs.run_mobile_ios_install_startup_smoke }}
        uses: actions/upload-artifact@v7
        with:
          name: deve-acceptance-receipts-ios-simulator
          path: ${{ runner.temp }}/deve-acceptance-ios-simulator
          if-no-files-found: error

      - name: Write Mobile iOS target-host evidence
        if: always()
        env:
          DEVE_NATIVE_TARGET_HOST_EVIDENCE_TARGET: Mobile iOS
          DEVE_NATIVE_TARGET_HOST_EVIDENCE_OUT: target/native-target-host-evidence/mobile-ios.md
          DEVE_NATIVE_TARGET_HOST_EVIDENCE_COMMANDS: |
            scripts/check-mobile-platform-package-preflight.sh
            scripts/check-native-process-adapter-gate.sh
            run_mobile_ios_package_build=${{ inputs.run_mobile_ios_package_build }}
            package_build_command=${{ inputs.run_mobile_ios_package_build && 'DEVE_MOBILE_IOS_PACKAGE_BUILD_REQUIRED=1 scripts/check-mobile-ios-shell-package-build.sh' || 'skipped' }}
            install_startup_command=${{ inputs.run_mobile_ios_package_build && inputs.run_mobile_ios_install_startup_smoke && 'DEVE_MOBILE_IOS_INSTALL_STARTUP_SMOKE_REQUIRED=1 DEVE_MOBILE_IOS_BOOT_SIMULATOR=1 scripts/check-mobile-ios-install-startup-smoke.sh' || 'skipped' }}
            package_closed_command=${{ ! inputs.run_mobile_ios_package_build && 'test ! -e apps/mobile/gen/apple' || 'skipped' }}
          DEVE_NATIVE_TARGET_HOST_EVIDENCE_COMMAND_RESULTS: |
            mobile_ios_preflight=${{ steps.mobile_ios_preflight.outcome }}
            process_gate=${{ steps.mobile_ios_process_gate.outcome }}
            package_build=${{ inputs.run_mobile_ios_package_build && inputs.run_mobile_ios_install_startup_smoke && steps.mobile_ios_acceptance.outcome || inputs.run_mobile_ios_package_build && steps.mobile_ios_package_build.outcome || 'skipped' }}
            install_startup_smoke=${{ inputs.run_mobile_ios_package_build && inputs.run_mobile_ios_install_startup_smoke && steps.mobile_ios_acceptance.outcome || 'skipped' }}
            package_closed_gate=${{ ! inputs.run_mobile_ios_package_build && steps.mobile_ios_package_closed_gate.outcome || 'skipped' }}
          DEVE_NATIVE_TARGET_HOST_EVIDENCE_ARTIFACTS: ${{ inputs.run_mobile_ios_package_build && 'apps/mobile/gen/apple/**' || 'N/A - iOS package execution remains closed' }}
          DEVE_NATIVE_TARGET_HOST_EVIDENCE_INSTALL_RESULT: ${{ inputs.run_mobile_ios_package_build && inputs.run_mobile_ios_install_startup_smoke && steps.mobile_ios_acceptance.outcome || inputs.run_mobile_ios_package_build && 'N/A - iOS install smoke not requested by package execution gate' || 'N/A - iOS package execution remains closed' }}
          DEVE_NATIVE_TARGET_HOST_EVIDENCE_STARTUP_RESULT: ${{ inputs.run_mobile_ios_package_build && inputs.run_mobile_ios_install_startup_smoke && steps.mobile_ios_acceptance.outcome || inputs.run_mobile_ios_package_build && 'N/A - iOS device/simulator startup smoke not requested by package execution gate' || 'N/A - iOS package execution remains closed' }}
          DEVE_NATIVE_TARGET_HOST_EVIDENCE_CONCLUSION: ${{ inputs.run_mobile_ios_package_build && inputs.run_mobile_ios_install_startup_smoke && 'iOS shell package build and simulator install/startup smoke attempted; inspect job result and artifacts before declaring simulator readiness' || inputs.run_mobile_ios_package_build && 'iOS shell package build attempted; inspect job result and artifacts before declaring device/install readiness' || 'diagnostic-only - iOS package execution remains closed' }}
        run: scripts/write-native-target-host-evidence.sh

      - name: Upload Mobile iOS target-host evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: deve-native-target-host-evidence-ios
          path: target/native-target-host-evidence/mobile-ios.md
          if-no-files-found: error
