name: Docker Smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docker-release-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust 1.97.0
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: "1.97.0"

      - name: Install Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install cargo-audit 0.22.2
        uses: taiki-e/install-action@a6b2e2dcd845ddd7f509ce4f3ed3d922b80cc5d9 # v2.84.0
        with:
          tool: cargo-audit@0.22.2
          fallback: none

      - name: Verify cargo-audit version
        run: test "$(cargo-audit --version)" = "cargo-audit 0.22.2"

      - name: Show Docker version
        run: docker version

      - name: Build acceptance candidate image once
        shell: bash
        run: |
          set -euo pipefail
          image="deve-notebook:acceptance-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          docker build --tag "$image" .
          image_id="$(docker image inspect --format '{{.Id}}' "$image")"
          echo "DEVE_RELEASE_CANDIDATE_IMAGE=$image" >>"$GITHUB_ENV"
          echo "DEVE_RELEASE_CANDIDATE_IMAGE_ID=$image_id" >>"$GITHUB_ENV"

      - name: Execute Docker acceptance producers
        run: >-
          cargo run --locked --quiet -p deve_baseline -- acceptance-run
          --tier full
          --receipt-dir "$RUNNER_TEMP/deve-acceptance-docker"

      - name: Execute security acceptance producer
        run: >-
          cargo run --locked --quiet -p deve_baseline -- acceptance-run
          --tier tag-ready
          --producer security.tag-ready-audit
          --receipt-dir "$RUNNER_TEMP/deve-acceptance-security"

      - name: Collect Linux acceptance receipts
        run: >-
          cargo run --locked --quiet -p deve_baseline -- acceptance-collect
          --output "$RUNNER_TEMP/deve-acceptance-linux"
          "$RUNNER_TEMP/deve-acceptance-docker"
          "$RUNNER_TEMP/deve-acceptance-security"

      - name: Upload Linux acceptance receipts
        uses: actions/upload-artifact@v7
        with:
          name: deve-acceptance-receipts-linux
          path: ${{ runner.temp }}/deve-acceptance-linux
          if-no-files-found: error
          retention-days: 30
