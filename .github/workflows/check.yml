name: Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract-checks:
    name: Contracts and documentation
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust 1.97.0
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: "1.97.0"
          components: rustfmt
      - name: Install Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Cache Cargo sources
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/registry/src
            ~/.cargo/git/db
          key: ${{ runner.os }}-cargo-source-rust-1.97.0-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-source-rust-1.97.0-
      - name: Fetch complete locked Cargo sources
        run: cargo fetch --locked
      - name: Guard check-only boundary
        run: |
          forbidden=(
            "packages: ""write"
            "docker/""login-action"
            "docker/""metadata-action"
            "docker/""build-push-action"
            "push: ""true"
            "ghcr"".io"
            "tags: ""['v*']"
            "deve-acceptance-""receipts-"
            "deve-release-""candidate-"
          )
          for pattern in "${forbidden[@]}"; do
            if grep -nF "$pattern" .github/workflows/check.yml; then
              echo "check.yml must stay check-only: no package publish, Docker publish, release artifacts, registry publish, or tag release trigger."
              exit 1
            fi
          done
      - name: Check formatting
        run: cargo fmt --check
      - name: Check Rust baseline contracts
        run: cargo run --locked --quiet -p deve_baseline -- all
      - name: Check acceptance producer plan
        run: |
          cargo run --locked --quiet -p deve_baseline -- acceptance-run --tier ci --plan
          cargo run --locked --quiet -p deve_baseline -- acceptance-run --tier tag-ready --plan
      - name: Check Android lifecycle harness contracts
        run: node --test scripts/android-lifecycle-harness.test.mjs scripts/mobile-android-emulator-journey.test.mjs
      - name: Check plan coverage
        run: |
          scripts/plan-coverage.sh --check-reverse-coverage
          scripts/plan-coverage.sh --check-metadata-completeness
          scripts/plan-coverage.sh --check-perf-budget
          scripts/check-perf-budget-baseline.sh
          scripts/check-reliability-observability-baseline.sh
          scripts/plan-coverage.sh --check-no-adr-plan-ref
          scripts/plan-coverage.sh --check-md-links docs/plan docs/features docs/acceptance-cases
          scripts/plan-coverage-selftest.sh

  rust-quality:
    name: Rust lint and Web WASM
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust 1.97.0
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: "1.97.0"
          targets: wasm32-unknown-unknown
          components: clippy
      - name: Cache Cargo sources
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/registry/src
            ~/.cargo/git/db
          key: ${{ runner.os }}-cargo-source-rust-1.97.0-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-source-rust-1.97.0-
      - name: Fetch complete locked Cargo sources
        run: cargo fetch --locked
      - name: Run clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Check web WASM target
        run: cargo check --locked -p deve_web --target wasm32-unknown-unknown

  workspace-tests:
    name: Workspace tests
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust 1.97.0
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: "1.97.0"
      - name: Cache Cargo sources
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/registry/src
            ~/.cargo/git/db
          key: ${{ runner.os }}-cargo-source-rust-1.97.0-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-source-rust-1.97.0-
      - name: Fetch complete locked Cargo sources
        run: cargo fetch --locked
      - name: Run tests
        run: cargo test --locked

  ci-acceptance-runtime:
    name: Required runtime CI producers (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust 1.97.0
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: "1.97.0"
      - name: Install Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Cache Cargo sources
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/registry/src
            ~/.cargo/git/db
          key: ${{ runner.os }}-cargo-source-rust-1.97.0-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-source-rust-1.97.0-
      - name: Fetch complete locked Cargo sources
        run: cargo fetch --locked
      - name: Plan required runtime CI producers
        run: >-
          cargo run --locked --quiet -p deve_baseline -- acceptance-run --tier ci --plan
          --producer ci.native-ipc-isolation
          --producer ci.native-ai-provider-settings
          --producer ci.agent-bridge-process-tree-unix
          --producer ci.plugin-host-lifecycle
      - name: Execute required runtime CI producers
        run: >-
          cargo run --locked --quiet -p deve_baseline -- acceptance-run --tier ci
          --producer ci.native-ipc-isolation
          --producer ci.native-ai-provider-settings
          --producer ci.agent-bridge-process-tree-unix
          --producer ci.plugin-host-lifecycle

  ci-acceptance-storage:
    name: Required storage CI producers (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust 1.97.0
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: "1.97.0"
      - name: Cache Cargo sources
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/registry/src
            ~/.cargo/git/db
          key: ${{ runner.os }}-cargo-source-rust-1.97.0-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-source-rust-1.97.0-
      - name: Fetch complete locked Cargo sources
        run: cargo fetch --locked
      - name: Plan required storage CI producers
        run: >-
          cargo run --locked --quiet -p deve_baseline -- acceptance-run --tier ci --plan
          --producer ci.storage-repository-cases
      - name: Execute required storage CI producers
        run: >-
          cargo run --locked --quiet -p deve_baseline -- acceptance-run --tier ci
          --producer ci.storage-repository-cases

  ci-acceptance-web:
    name: Required Web and projection CI producers (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust 1.97.0
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: "1.97.0"
      - name: Install Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Cache Cargo sources
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/registry/src
            ~/.cargo/git/db
          key: ${{ runner.os }}-cargo-source-rust-1.97.0-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-source-rust-1.97.0-
      - name: Fetch complete locked Cargo sources
        run: cargo fetch --locked
      - name: Plan required Web and projection CI producers
        run: >-
          cargo run --locked --quiet -p deve_baseline -- acceptance-run --tier ci --plan
          --producer ci.diff-projection
          --producer ci.document-create-idempotence
          --producer ci.projection-recovery
          --producer ci.storage-browser-boundaries
      - name: Execute required Web and projection CI producers
        run: >-
          cargo run --locked --quiet -p deve_baseline -- acceptance-run --tier ci
          --producer ci.diff-projection
          --producer ci.document-create-idempotence
          --producer ci.projection-recovery
          --producer ci.storage-browser-boundaries

  ci-acceptance-windows:
    name: Required CI producers (Windows)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust 1.97.0
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: "1.97.0"
      - name: Cache Cargo sources
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/registry/src
            ~/.cargo/git/db
          key: ${{ runner.os }}-cargo-source-rust-1.97.0-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-source-rust-1.97.0-
      - name: Fetch complete locked Cargo sources
        run: cargo fetch --locked
      - name: Plan required Windows CI producers
        run: >-
          cargo run --locked --quiet -p deve_baseline -- acceptance-run --tier ci --plan
          --producer ci.agent-bridge-containment-windows
      - name: Execute required Windows CI producers
        run: >-
          cargo run --locked --quiet -p deve_baseline -- acceptance-run --tier ci
          --producer ci.agent-bridge-containment-windows

  watcher-native-fs:
    name: Watcher real filesystem (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust 1.97.0
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: "1.97.0"
      - name: Cache Cargo sources
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/registry/src
            ~/.cargo/git/db
          key: ${{ runner.os }}-cargo-source-rust-1.97.0-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-source-rust-1.97.0-
      - name: Fetch complete locked Cargo sources
        run: cargo fetch --locked
      - name: Run watcher platform filesystem evidence
        run: cargo test --locked -p deve_core --test watcher_platform_fs -- --nocapture --test-threads=1
      - name: Run watcher writeback-loop evidence
        run: cargo test --locked -p deve_core --test watcher_writeback_loop -- --nocapture --test-threads=1
      - name: Run watcher rename-pairing evidence
        run: cargo test --locked -p deve_core --test watcher_rename_pairing -- --nocapture --test-threads=1

  impact-shadow:
    name: Dependency impact shadow audit
    if: ${{ always() }}
    needs:
      - contract-checks
      - rust-quality
      - workspace-tests
      - ci-acceptance-runtime
      - ci-acceptance-storage
      - ci-acceptance-web
      - ci-acceptance-windows
      - watcher-native-fs
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Install Rust 1.97.0
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: "1.97.0"
      - name: Cache Cargo sources
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/registry/src
            ~/.cargo/git/db
          key: ${{ runner.os }}-cargo-source-rust-1.97.0-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-source-rust-1.97.0-
      - name: Fetch complete locked Cargo sources
        run: cargo fetch --locked
      - name: Write PR selective-versus-full observation
        if: ${{ github.event_name == 'pull_request' }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
          RESULT_CONTRACTS: contract-checks=${{ needs.contract-checks.result }}
          RESULT_QUALITY: rust-quality=${{ needs.rust-quality.result }}
          RESULT_WORKSPACE: workspace-tests=${{ needs.workspace-tests.result }}
          RESULT_RUNTIME: ci-acceptance-runtime=${{ needs.ci-acceptance-runtime.result }}
          RESULT_STORAGE: ci-acceptance-storage=${{ needs.ci-acceptance-storage.result }}
          RESULT_WEB: ci-acceptance-web=${{ needs.ci-acceptance-web.result }}
          RESULT_WINDOWS: ci-acceptance-windows=${{ needs.ci-acceptance-windows.result }}
          RESULT_WATCHER: watcher-native-fs=${{ needs.watcher-native-fs.result }}
        run: |
          set -euo pipefail
          mkdir -p target/acceptance-impact
          cargo run --locked --quiet -p deve_baseline -- acceptance-impact-shadow \
            --base "$BASE_SHA" \
            --head "$HEAD_SHA" \
            --result "$RESULT_RUNTIME" \
            --result "$RESULT_STORAGE" \
            --result "$RESULT_WEB" \
            --result "$RESULT_WINDOWS" \
            --result "$RESULT_CONTRACTS" \
            --result "$RESULT_QUALITY" \
            --result "$RESULT_WATCHER" \
            --result "$RESULT_WORKSPACE" \
            >target/acceptance-impact/shadow-report.json
          jq '{status, selector_outcome, selected_ci_jobs, full_failures, observed_misses}' \
            target/acceptance-impact/shadow-report.json >>"$GITHUB_STEP_SUMMARY"
      - name: Write full-source plan outside pull requests
        if: ${{ github.event_name != 'pull_request' }}
        run: |
          set -euo pipefail
          mkdir -p target/acceptance-impact
          cargo run --locked --quiet -p deve_baseline -- acceptance-impact \
            --profile main-full-source >target/acceptance-impact/full-source-plan.json
      - name: Upload non-authoritative impact diagnostic
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: deve-impact-shadow-${{ github.sha }}
          path: target/acceptance-impact/*.json
          if-no-files-found: error
          retention-days: 14

  check:
    if: ${{ always() }}
    needs:
      - contract-checks
      - rust-quality
      - workspace-tests
      - ci-acceptance-runtime
      - ci-acceptance-storage
      - ci-acceptance-web
      - ci-acceptance-windows
      - watcher-native-fs
      - impact-shadow
    runs-on: ubuntu-latest
    steps:
      - name: Fail closed unless every required CI job succeeded
        if: ${{ needs.contract-checks.result != 'success' || needs.rust-quality.result != 'success' || needs.workspace-tests.result != 'success' || needs.ci-acceptance-runtime.result != 'success' || needs.ci-acceptance-storage.result != 'success' || needs.ci-acceptance-web.result != 'success' || needs.ci-acceptance-windows.result != 'success' || needs.watcher-native-fs.result != 'success' || needs.impact-shadow.result != 'success' }}
        run: exit 1
