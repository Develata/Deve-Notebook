name: Release
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Validate SemVer release tag
        shell: bash
        run: |
          set -euo pipefail
          core='(0|[1-9][0-9]*)'
          prerelease_id='(0|[1-9][0-9]*|[0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*)'
          build_id='[0-9A-Za-z-]+'
          semver="^v${core}\.${core}\.${core}(-${prerelease_id}(\.${prerelease_id})*)?(\+${build_id}(\.${build_id})*)?$"
          if [[ ! "$GITHUB_REF_NAME" =~ $semver ]]; then
            echo "invalid SemVer release tag: $GITHUB_REF_NAME" >&2
            exit 1
          fi

      - uses: actions/checkout@v6

      - name: Match tag to checked-out package versions
        run: bash scripts/check-release-version-match.sh "$GITHUB_REF_NAME"
      
      - name: Install Rust 1.92
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.92
          targets: wasm32-unknown-unknown

      - name: Install Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Test release smoke harnesses
        run: |
          bash scripts/check-release-version-match.test.sh
          bash scripts/validate-release-image-tags.test.sh
          node --test scripts/smoke-docker-existing-image.test.mjs
          node --test scripts/smoke-desktop-packaged-ui.test.mjs
      
      - name: Cache cargo registry and build
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      
      - name: Run clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Check web WASM target
        run: cargo check --locked -p deve_web --target wasm32-unknown-unknown

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Audit dependencies
        run: |
          DEVE_RELEASE_AUDIT_REQUIRED=1 scripts/check-release-audit-gate.sh
          cargo run --locked -p deve_baseline -- release-audit-gate tag-ready

      - name: Check plan coverage
        run: |
          scripts/plan-coverage.sh --write-report --check-reverse-coverage
          scripts/plan-coverage.sh --check-metadata-completeness
          scripts/plan-coverage.sh --check-perf-budget
          scripts/check-perf-budget-baseline.sh
          scripts/check-reliability-observability-baseline.sh
          scripts/plan-coverage.sh --check-no-adr-plan-ref
          scripts/plan-coverage.sh --check-md-links
          scripts/plan-coverage-selftest.sh

      - name: Check architecture registry
        run: scripts/check-architecture-registry.sh

      - name: Check native boundary and graph baselines
        run: |
          scripts/check-native-track-boundary.sh
          DEVE_NATIVE_PROCESS_ADAPTER_RUN_NATIVE_PACKAGING_TESTS=0 scripts/check-native-process-adapter-gate.sh
          scripts/check-graph-baseline.sh
      
      - name: Run tests
        run: cargo test --locked

  docker:
    runs-on: ubuntu-latest
    needs: test
    env:
      RELEASE_CANDIDATE_IMAGE: deve-notebook:release-candidate-${{ github.run_id }}-${{ github.run_attempt }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest
      
      - name: Build release candidate image once
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          platforms: linux/amd64
          tags: ${{ env.RELEASE_CANDIDATE_IMAGE }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Record release candidate image ID
        id: candidate
        shell: bash
        run: echo "image_id=$(docker image inspect --format '{{.Id}}' "$RELEASE_CANDIDATE_IMAGE")" >>"$GITHUB_OUTPUT"

      - name: Smoke exact release candidate image
        env:
          DEVE_DOCKER_SMOKE_REQUIRED: '1'
          DEVE_DOCKER_SMOKE_SKIP_BUILD: '1'
          DEVE_DOCKER_SMOKE_IMAGE: ${{ env.RELEASE_CANDIDATE_IMAGE }}
        run: scripts/smoke-docker-release.sh

      - name: Browser-smoke exact release candidate image
        env:
          DEVE_DOCKER_MULTI_REQUIRED: '1'
          DEVE_DOCKER_MULTI_SKIP_BUILD: '1'
          DEVE_DOCKER_MULTI_IMAGE: ${{ env.RELEASE_CANDIDATE_IMAGE }}
        run: scripts/smoke-docker-multiclient.sh

      - name: Verify candidate identity after smokes
        shell: bash
        run: |
          set -euo pipefail
          observed="$(docker image inspect --format '{{.Id}}' "$RELEASE_CANDIDATE_IMAGE")"
          [[ "$observed" == "${{ steps.candidate.outputs.image_id }}" ]] || {
            echo "release candidate image changed during smoke: expected=${{ steps.candidate.outputs.image_id }} observed=$observed" >&2
            exit 1
          }

      - name: Validate tags and push verified candidate image
        id: pushed_tags
        env:
          RELEASE_IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
          RELEASE_VERSION: ${{ steps.meta.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t tags < <(printf '%s\n' "$RELEASE_IMAGE_TAGS" | sed '/^$/d')
          mapfile -t validated_tags < <(bash scripts/validate-release-image-tags.sh "$RELEASE_VERSION" "${tags[@]}")
          [[ "${#validated_tags[@]}" -eq 2 ]] || { echo "release tag validator returned an invalid result" >&2; exit 1; }
          version_tag="${validated_tags[0]}"
          latest_tag="${validated_tags[1]}"
          echo "latest_tag=$latest_tag" >>"$GITHUB_OUTPUT"
          echo "version_tag=$version_tag" >>"$GITHUB_OUTPUT"
          for tag in "$version_tag" "$latest_tag"; do
            docker tag "$RELEASE_CANDIDATE_IMAGE" "$tag"
            docker push "$tag"
          done

      - name: Verify remote release tag digests
        shell: bash
        run: |
          set -euo pipefail
          version_tag='${{ steps.pushed_tags.outputs.version_tag }}'
          latest_tag='${{ steps.pushed_tags.outputs.latest_tag }}'
          first_digest="$(docker buildx imagetools inspect "$version_tag" --format '{{.Manifest.Digest}}')"
          second_digest="$(docker buildx imagetools inspect "$latest_tag" --format '{{.Manifest.Digest}}')"
          [[ -n "$first_digest" && "$first_digest" == "$second_digest" ]] || {
            echo "remote release tag digest mismatch: $version_tag=$first_digest $latest_tag=$second_digest" >&2
            exit 1
          }

  native:
    needs: docker
    permissions:
      contents: write
    uses: ./.github/workflows/release-native.yml
    secrets:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
