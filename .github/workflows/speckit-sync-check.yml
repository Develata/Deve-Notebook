name: Speckit Sync Check

on:
  pull_request:
    paths:
      - '.opencode/command/**'
      - '.codex/prompts/**'
      - '.claude/commands/**'
      - '.specify/scripts/powershell/sync-speckit.ps1'
      - '.specify/scripts/powershell/check-speckit-sync.ps1'
  push:
    branches: [main, master]
    paths:
      - '.opencode/command/**'
      - '.codex/prompts/**'
      - '.claude/commands/**'

jobs:
  sync-check:
    name: Validate Speckit Directory Synchronization
    runs-on: windows-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Setup PowerShell
        shell: pwsh
        run: |
          $PSVersionTable
          
      - name: Run speckit sync check
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Write-Host "Running speckit synchronization validation..."

          try {
            # First run sync to ensure mirrors are up-to-date
            & .\.specify\scripts\powershell\sync-speckit.ps1

            # Then run check to validate consistency
            & .\.specify\scripts\powershell\check-speckit-sync.ps1
          } catch {
            Write-Error "Speckit synchronization validation failed."
            Write-Error $_
            Write-Error "Please run the following commands locally and commit the changes:"
            Write-Error "  pwsh -File .specify/scripts/powershell/sync-speckit.ps1"
            Write-Error "  pwsh -File .specify/scripts/powershell/check-speckit-sync.ps1"
            exit 1
          }

          Write-Host "✅ Speckit directories are synchronized" -ForegroundColor Green
          
      - name: Check for uncommitted changes
        shell: pwsh
        run: |
          $changes = git status --porcelain
          if ($changes) {
            Write-Error "Uncommitted changes detected after sync:"
            Write-Error $changes
            Write-Error "Please run the sync script locally and commit all changes."
            exit 1
          }
          Write-Host "✅ No uncommitted changes" -ForegroundColor Green
