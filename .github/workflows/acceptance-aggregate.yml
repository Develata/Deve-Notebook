name: Acceptance Receipt Aggregate

on:
  workflow_dispatch:
    inputs:
      receipt_run_ids:
        description: Exact release-candidate workflow run ID for this candidate HEAD.
        type: string
        required: true

permissions:
  actions: read
  attestations: read
  contents: read

concurrency:
  group: acceptance-aggregate-${{ github.sha }}
  cancel-in-progress: false

jobs:
  aggregate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install Rust 1.92
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.92

      - name: Validate and download exact candidate run
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RECEIPT_RUN_IDS: ${{ inputs.receipt_run_ids }}
        run: |
          set -euo pipefail
          run_id="${RECEIPT_RUN_IDS//[[:space:]]/}"
          [[ "$run_id" =~ ^[1-9][0-9]*$ && "$RECEIPT_RUN_IDS" != *,* ]] || {
            echo "acceptance aggregate: exactly one release-candidate run ID is required" >&2
            exit 1
          }

          metadata="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id")"
          [[ "$GITHUB_RUN_ATTEMPT" == 1 ]] || {
            echo 'acceptance aggregate runs are immutable; dispatch a fresh run instead of rerunning' >&2
            exit 1
          }
          [[ "$(jq -r .head_sha <<<"$metadata")" == "$GITHUB_SHA" ]] || {
            echo "acceptance aggregate: candidate run HEAD does not match $GITHUB_SHA" >&2
            exit 1
          }
          [[ "$(jq -r .conclusion <<<"$metadata")" == success ]] || {
            echo "acceptance aggregate: candidate run is not successful" >&2
            exit 1
          }
          [[ "$(jq -r .event <<<"$metadata")" == workflow_dispatch ]] || {
            echo "acceptance aggregate: candidate run must be a workflow_dispatch run" >&2
            exit 1
          }
          [[ "$(jq -r .path <<<"$metadata")" == .github/workflows/release-candidate.yml ]] || {
            echo "acceptance aggregate: run is not owned by release-candidate.yml" >&2
            exit 1
          }

          candidate="$RUNNER_TEMP/deve-release-candidate"
          receipts="$RUNNER_TEMP/deve-acceptance-download"
          mkdir -p "$candidate" "$receipts"
          gh run download "$run_id" --repo "$GITHUB_REPOSITORY" \
            --name "deve-release-candidate-$GITHUB_SHA" --dir "$candidate"
          gh run download "$run_id" --repo "$GITHUB_REPOSITORY" \
            --pattern 'deve-acceptance-receipts-*' --dir "$receipts"
          printf 'DEVE_CANDIDATE_RUN_ID=%s\n' "$run_id" >>"$GITHUB_ENV"
          printf 'DEVE_CANDIDATE_RUN_ATTEMPT=%s\n' "$(jq -er .run_attempt <<<"$metadata")" >>"$GITHUB_ENV"
          printf 'DEVE_CANDIDATE_DIR=%s\n' "$candidate" >>"$GITHUB_ENV"
          printf 'DEVE_RECEIPT_DOWNLOAD=%s\n' "$receipts" >>"$GITHUB_ENV"

      - name: Verify sealed artifacts and GitHub attestations
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          manifest="$DEVE_CANDIDATE_DIR/release-candidate.json"
          [[ -f "$manifest" ]] || { echo "candidate manifest is missing" >&2; exit 1; }
          artifact_path() {
            jq -er --arg role "$1" '.artifacts[] | select(.role == $role) | .path' "$manifest"
          }
          export DEVE_BASELINE_BIN="$GITHUB_WORKSPACE/target/debug/deve_baseline"
          export DEVE_RELEASE_CANDIDATE_DIR="$DEVE_CANDIDATE_DIR"
          export DEVE_RELEASE_CANDIDATE_HEAD="$GITHUB_SHA"
          export DEVE_RELEASE_CANDIDATE_VERSION="$(jq -er .version "$manifest")"
          export DEVE_RELEASE_CANDIDATE_WORKFLOW_PATH=.github/workflows/release-candidate.yml
          export DEVE_RELEASE_CANDIDATE_RUN_ID="$DEVE_CANDIDATE_RUN_ID"
          [[ "$(jq -er .workflow.run_attempt "$manifest")" == "$DEVE_CANDIDATE_RUN_ATTEMPT" ]] || {
            echo 'candidate manifest run attempt does not match Actions metadata' >&2
            exit 1
          }
          export DEVE_RELEASE_CANDIDATE_RUN_ATTEMPT
          export DEVE_RELEASE_CANDIDATE_IMAGE_ID="$(jq -er .docker_image_id "$manifest")"
          export DEVE_RELEASE_ANDROID_SIGNER_SHA256="$(jq -er .android_signer_sha256 "$manifest")"
          export DEVE_RELEASE_WINDOWS_MSI="$(artifact_path windows-msi)"
          export DEVE_RELEASE_WINDOWS_NSIS="$(artifact_path windows-nsis)"
          export DEVE_RELEASE_MACOS_DMG="$(artifact_path macos-dmg)"
          export DEVE_RELEASE_ANDROID_APK="$(artifact_path android-arm64-apk)"
          export DEVE_RELEASE_DOCKER_ARCHIVE="$(artifact_path docker-linux-amd64-archive)"
          export DEVE_RELEASE_SOURCE_SBOM="$(artifact_path source-spdx)"
          export DEVE_RELEASE_IMAGE_SBOM="$(artifact_path image-spdx)"
          export DEVE_RELEASE_PROVENANCE_BUNDLE="$(artifact_path provenance-attestation)"
          export DEVE_RELEASE_DOCKER_SBOM_BUNDLE="$(artifact_path docker-sbom-attestation)"
          export DEVE_RELEASE_ATTESTATION_VERIFY_REQUIRED=1
          cargo build --locked -p deve_baseline
          bash scripts/check-release-candidate-bundle.sh

      - name: Collect and validate exact-HEAD receipts
        shell: bash
        run: |
          set -euo pipefail
          collected="$RUNNER_TEMP/deve-acceptance-collected"
          mapfile -d '' receipt_dirs < <(find "$DEVE_RECEIPT_DOWNLOAD" -type d -name receipts -print0 | sort -z)
          [[ "${#receipt_dirs[@]}" -gt 0 ]] || {
            echo "acceptance aggregate: candidate run contains no receipt directories" >&2
            exit 1
          }
          artifact_roots=()
          for receipt_dir in "${receipt_dirs[@]}"; do
            artifact_roots+=("${receipt_dir%/receipts}")
          done
          cargo run --locked --quiet -p deve_baseline -- acceptance-collect \
            --output "$collected" "${artifact_roots[@]}"
          cargo run --locked --quiet -p deve_baseline -- acceptance-matrix \
            --tag-ready "$collected"
          sealed="$RUNNER_TEMP/deve-release-sealed"
          mkdir -p "$sealed/candidate" "$sealed/receipts"
          cp -a "$DEVE_CANDIDATE_DIR/." "$sealed/candidate/"
          cp -a "$collected/." "$sealed/receipts/"

      - name: Upload exact-HEAD sealed release candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: deve-release-sealed-${{ github.sha }}
          path: ${{ runner.temp }}/deve-release-sealed
          if-no-files-found: error
          retention-days: 30
