  mobile-android-local-journey:
    needs: [mobile-android-apk-build, mobile-android-harness-build]
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.candidate_head }}
          persist-credentials: false
      - name: Install Node.js 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - name: Install Java 17
        uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5
        with:
          distribution: temurin
          java-version: 17
      - name: Install Android SDK platform tools
        run: |
          set -euo pipefail
          test -n "${ANDROID_HOME:-}"
          echo "$ANDROID_HOME/platform-tools" >>"$GITHUB_PATH"
          echo "$ANDROID_HOME/emulator" >>"$GITHUB_PATH"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >>"$GITHUB_PATH"
          export PATH="$ANDROID_HOME/platform-tools:$ANDROID_HOME/emulator:$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "emulator"
      - name: Download immutable Android journey APKs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: deve-native-android-journey-input-${{ inputs.candidate_head }}
          path: .
      - name: Download immutable Android harness programs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: deve-native-android-harness-${{ inputs.candidate_head }}
          path: target/android-candidate-harness
      - name: Verify downloaded Android producer inputs
        run: |
          set -euo pipefail
          chmod +x target/android-candidate-harness/debug/deve_baseline target/android-candidate-harness/release/deve_cli
          (cd target/android-candidate-harness && sha256sum -c android-harness-input.sha256)
          source scripts/lib/android-prebuilt-apk.sh
          android_prebuilt_apk_manifest_verify "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/target/android-apk-input.sha256" apps/mobile/gen/android/app/build/outputs/apk/universal/release/app-universal-release-unsigned.apk apps/mobile/gen/android/app/build/outputs/apk/universal/debug/app-universal-debug.apk
      - name: Prepare Android emulator host
        run: bash scripts/prepare-android-emulator-host.sh
      - name: Run isolated Android LocalBackend candidate journey
        env:
          DEVE_MOBILE_ANDROID_EMULATOR_API_LEVEL: "37.0"
          DEVE_MOBILE_ANDROID_EMULATOR_SYSTEM_TARGET: google_apis
          DEVE_MOBILE_ANDROID_PACKAGE_TARGET: x86_64
          DEVE_MOBILE_ANDROID_PREBUILT_APKS_REQUIRED: "1"
          DEVE_MOBILE_ANDROID_PREBUILT_APK_MANIFEST: ${{ github.workspace }}/target/android-apk-input.sha256
          DEVE_MOBILE_ANDROID_EMULATOR_STATIC_CHECKS_REQUIRED: "0"
        run: >-
          "$GITHUB_WORKSPACE/target/android-candidate-harness/debug/deve_baseline" acceptance-run
          --tier target-host
          --producer android.local-backend
          --receipt-dir "$RUNNER_TEMP/deve-acceptance-android-local"
      - name: Stop Android emulator
        if: ${{ always() }}
        run: |
          set +e
          bash scripts/cleanup-mobile-android-emulator.sh
      - name: Upload isolated Android LocalBackend receipt
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: deve-acceptance-receipts-android-local-${{ inputs.candidate_head }}
          path: ${{ runner.temp }}/deve-acceptance-android-local
          if-no-files-found: error
          retention-days: 14
      - name: Upload bounded Android LocalBackend diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: deve-candidate-android-diagnostics-local-${{ inputs.candidate_head }}
          path: target/mobile-android-emulator-smoke/**
          if-no-files-found: warn
          retention-days: 14

  mobile-android-remote-journey:
    needs: [mobile-android-apk-build, mobile-android-harness-build]
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.candidate_head }}
          persist-credentials: false
      - name: Install Node.js 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - name: Install Java 17
        uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5
        with:
          distribution: temurin
          java-version: 17
      - name: Install Android SDK platform tools
        run: |
          set -euo pipefail
          test -n "${ANDROID_HOME:-}"
          echo "$ANDROID_HOME/platform-tools" >>"$GITHUB_PATH"
          echo "$ANDROID_HOME/emulator" >>"$GITHUB_PATH"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >>"$GITHUB_PATH"
          export PATH="$ANDROID_HOME/platform-tools:$ANDROID_HOME/emulator:$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "emulator"
      - name: Download immutable Android journey APKs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: deve-native-android-journey-input-${{ inputs.candidate_head }}
          path: .
      - name: Download immutable Android harness programs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: deve-native-android-harness-${{ inputs.candidate_head }}
          path: target/android-candidate-harness
      - name: Verify downloaded Android producer inputs
        run: |
          set -euo pipefail
          chmod +x target/android-candidate-harness/debug/deve_baseline target/android-candidate-harness/release/deve_cli
          (cd target/android-candidate-harness && sha256sum -c android-harness-input.sha256)
          source scripts/lib/android-prebuilt-apk.sh
          android_prebuilt_apk_manifest_verify "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/target/android-apk-input.sha256" apps/mobile/gen/android/app/build/outputs/apk/universal/release/app-universal-release-unsigned.apk apps/mobile/gen/android/app/build/outputs/apk/universal/debug/app-universal-debug.apk
      - name: Prepare Android emulator host
        run: bash scripts/prepare-android-emulator-host.sh
      - name: Prepare exact-HEAD Android RemoteBrowser fixture
        run: |
          set -euo pipefail
          head_file="$RUNNER_TEMP/deve-android-candidate-head.txt"
          printf '%s' "$GITHUB_SHA" >"$head_file"
          bash scripts/remote-browser-fixture.sh start \
            --state-dir "$RUNNER_TEMP/deve-android-remote-fixture" \
            --expected-head "$GITHUB_SHA" \
            --backend-executable "$GITHUB_WORKSPACE/target/android-candidate-harness/release/deve_cli" \
            --backend-head-file "$head_file" \
            --password-hasher "$GITHUB_WORKSPACE/target/android-candidate-harness/debug/deve_baseline" \
            --password-hasher-arg remote-fixture-password-hash >/dev/null
      - name: Bind bounded RemoteBrowser fixture inputs
        run: |
          set -euo pipefail
          fixture="$RUNNER_TEMP/deve-android-remote-fixture/fixture-env.json"
          credentials_file="$(jq -r .credentials_file "$fixture")"
          username="$(jq -r .username "$credentials_file")"
          password="$(jq -r .password "$credentials_file")"
          echo "::add-mask::$username"
          echo "::add-mask::$password"
          {
            printf 'DEVE_MOBILE_ANDROID_REMOTE_HTTPS_ORIGIN=%s\n' "$(jq -r .https_origin "$fixture")"
            printf 'DEVE_MOBILE_ANDROID_REMOTE_USERNAME=%s\n' "$username"
            printf 'DEVE_MOBILE_ANDROID_REMOTE_PASSWORD=%s\n' "$password"
          } >>"$GITHUB_ENV"
      - name: Run isolated Android RemoteBrowser candidate journey
        env:
          DEVE_MOBILE_ANDROID_EMULATOR_API_LEVEL: "37.0"
          DEVE_MOBILE_ANDROID_EMULATOR_SYSTEM_TARGET: google_apis
          DEVE_MOBILE_ANDROID_PACKAGE_TARGET: x86_64
          DEVE_MOBILE_ANDROID_PREBUILT_APKS_REQUIRED: "1"
          DEVE_MOBILE_ANDROID_PREBUILT_APK_MANIFEST: ${{ github.workspace }}/target/android-apk-input.sha256
          DEVE_MOBILE_ANDROID_EMULATOR_STATIC_CHECKS_REQUIRED: "0"
        run: >-
          "$GITHUB_WORKSPACE/target/android-candidate-harness/debug/deve_baseline" acceptance-run
          --tier target-host
          --producer android.remote-browser
          --receipt-dir "$RUNNER_TEMP/deve-acceptance-android-remote"
      - name: Stop Android fixture and emulator
        if: ${{ always() }}
        run: |
          set +e
          status=0
          [[ ! -f "$RUNNER_TEMP/deve-android-remote-fixture/fixture-state.json" ]] || bash scripts/remote-browser-fixture.sh stop --state-dir "$RUNNER_TEMP/deve-android-remote-fixture" || status=1
          bash scripts/cleanup-mobile-android-emulator.sh || status=1
          exit "$status"
      - name: Upload isolated Android RemoteBrowser receipt
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: deve-acceptance-receipts-android-remote-${{ inputs.candidate_head }}
          path: ${{ runner.temp }}/deve-acceptance-android-remote
          if-no-files-found: error
          retention-days: 14
      - name: Upload bounded Android RemoteBrowser diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: deve-candidate-android-diagnostics-remote-${{ inputs.candidate_head }}
          path: target/mobile-android-emulator-smoke/**
          if-no-files-found: warn
          retention-days: 14

  mobile-android-arm64-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      DEVE_MOBILE_PACKAGE_HOST_NATIVE_PACKAGING_CHECK: "0"
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.candidate_head }}
          persist-credentials: false
      - name: Verify candidate identity, version, and signing inputs
        env:
          VERSION: ${{ inputs.version }}
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = 1 || { echo 'release candidate Android runs are immutable; dispatch a fresh run instead of rerunning' >&2; exit 1; }
          test "$(git rev-parse HEAD)" = "${{ inputs.candidate_head }}"
          scripts/check-release-version-match.sh "v$VERSION"
          test -n "$KEYSTORE" && test -n "$STORE_PASSWORD" && test -n "$KEY_ALIAS" && test -n "$KEY_PASSWORD"
      - name: Install Rust 1.97.0
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: "1.97.0"
          targets: aarch64-linux-android
      - name: Install Node.js 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - name: Install Java 17
        uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5
        with:
          distribution: temurin
          java-version: 17
      - name: Install native packaging tools
        env:
          DEVE_NATIVE_INSTALL_TRUNK: "0"
          DEVE_NATIVE_INSTALL_TAURI_CLI: "1"
        run: scripts/install-native-target-host-tools.sh
      - name: Download immutable exact Web projection
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.web_dist_artifact }}
          path: .
      - name: Verify exact Web projection input
        run: >-
          node scripts/web-dist-artifact.mjs verify
          --root apps/web/dist
          --manifest target/release-input/web-dist.json
          --expected-head "${{ inputs.candidate_head }}"
      - name: Build final ARM64 APK once
        env:
          DEVE_MOBILE_ANDROID_PACKAGE_BUILD_REQUIRED: "1"
          DEVE_MOBILE_ANDROID_PACKAGE_TARGET: aarch64
          DEVE_MOBILE_ANDROID_PACKAGE_APK: "1"
          DEVE_MOBILE_ANDROID_PACKAGE_AAB: "0"
          DEVE_MOBILE_ANDROID_WEB_DIST_PREBUILT: "1"
        run: scripts/check-mobile-android-shell-package-build.sh
      - name: Sign and verify exact ARM64 APK
        env:
          VERSION: ${{ inputs.version }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          mapfile -d '' apks < <(find apps/mobile/gen/android/app/build/outputs/apk -path '*release*' -type f -name '*-unsigned.apk' -print0)
          [[ ${#apks[@]} -eq 1 ]] || { printf 'expected one unsigned ARM64 APK, found %s\n' "${#apks[@]}" >&2; exit 1; }
          buildtools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n1)"
          [[ -x "$buildtools/apksigner" && -x "$buildtools/zipalign" ]]
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode >"$RUNNER_TEMP/release.keystore"
          trap 'rm -f -- "$RUNNER_TEMP/release.keystore" "$RUNNER_TEMP/aligned.apk"' EXIT
          mkdir -p dist-native
          "$buildtools/zipalign" -f -p 4 "${apks[0]}" "$RUNNER_TEMP/aligned.apk"
          signed="dist-native/deve-notebook-${VERSION}-android-arm64.apk"
          "$buildtools/apksigner" sign --ks "$RUNNER_TEMP/release.keystore" --ks-pass env:ANDROID_KEYSTORE_PASSWORD --ks-key-alias "$ANDROID_KEY_ALIAS" --key-pass env:ANDROID_KEY_PASSWORD --out "$signed" "$RUNNER_TEMP/aligned.apk"
          "$buildtools/apksigner" verify --verbose --print-certs "$signed" | tee "$RUNNER_TEMP/apksigner.txt"
          signer="$(DEVE_ANDROID_APKSIGNER="$buildtools/apksigner" bash scripts/check-android-apk-signer.sh --print-fingerprint "$signed")"
          [[ "$signer" =~ ^sha256:[0-9a-f]{64}$ ]]
          printf '%s\n' "$signer" >dist-native/android-signer-sha256.txt
      - name: Upload exact signed Android candidate bytes
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: deve-native-android-${{ inputs.candidate_head }}
          path: dist-native
          if-no-files-found: error
          retention-days: 14
