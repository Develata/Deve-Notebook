name: Build and Smoke Native Candidate

# Reusable exact-HEAD native DAG. Build jobs publish immutable package inputs;
# isolated smoke jobs consume those bytes and never rebuild them.
on:
  workflow_call:
    inputs:
      version:
        description: Exact workspace version without a v prefix.
        required: true
        type: string
      candidate_head:
        description: Exact 40-character candidate commit.
        required: true
        type: string
      web_dist_artifact:
        description: Immutable exact-HEAD Web projection artifact from the caller.
        required: true
        type: string
    secrets:
      ANDROID_KEYSTORE_BASE64:
        required: true
      ANDROID_KEYSTORE_PASSWORD:
        required: true
      ANDROID_KEY_ALIAS:
        required: true
      ANDROID_KEY_PASSWORD:
        required: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  desktop-windows-build:
    runs-on: windows-latest
    timeout-minutes: 180
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.candidate_head }}
          persist-credentials: false
      - name: Verify candidate identity and version
        env:
          EXPECTED_HEAD: ${{ inputs.candidate_head }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = 1 || { echo 'release candidate Windows runs are immutable; dispatch a fresh run instead of rerunning' >&2; exit 1; }
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$GITHUB_SHA" = "$EXPECTED_HEAD"
          scripts/check-release-version-match.sh "v$VERSION"
      - name: Install Rust 1.97.0
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: "1.97.0"
          targets: x86_64-pc-windows-msvc
      - name: Install Node.js 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - name: Cache Cargo source inputs
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-candidate-windows-build-rust-1.97.0-${{ hashFiles('Cargo.lock') }}
      - name: Fetch locked Cargo inputs
        run: cargo fetch --locked
      - name: Install native packaging tools
        env:
          DEVE_NATIVE_INSTALL_TRUNK: "0"
          DEVE_NATIVE_INSTALL_TAURI_CLI: "1"
        run: scripts/install-native-target-host-tools.sh
      - name: Install NSIS
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $nsis = "${env:ProgramFiles(x86)}\NSIS"
          if (!(Test-Path "$nsis\makensis.exe")) { choco install nsis -y --no-progress }
          if (!(Test-Path "$nsis\makensis.exe")) { throw "NSIS is unavailable at $nsis" }
          Add-Content -Path $env:GITHUB_PATH -Value $nsis
      - name: Download immutable exact Web projection
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.web_dist_artifact }}
          path: .
      - name: Verify exact Web projection input
        run: >-
          node scripts/web-dist-artifact.mjs verify
          --root apps/web/dist
          --manifest target/release-input/web-dist.json
          --expected-head "${{ inputs.candidate_head }}"
      - name: Build exact Windows packages once
        env:
          DEVE_DESKTOP_PACKAGE_BUILD_REQUIRED: "1"
          DEVE_DESKTOP_PACKAGE_BUNDLES: msi,nsis
          DEVE_DESKTOP_PACKAGE_NO_SIGN: "1"
        run: scripts/check-desktop-platform-package-build.sh
      - name: Collect exact Windows candidate bytes
        shell: pwsh
        env:
          VERSION: ${{ inputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Path dist-native -Force | Out-Null
          $msi = @(Get-ChildItem target/release/bundle/msi -Filter *.msi -File)
          $nsis = @(Get-ChildItem target/release/bundle/nsis -Filter *.exe -File)
          if ($msi.Count -ne 1 -or $nsis.Count -ne 1) { throw 'expected exactly one MSI and one NSIS candidate' }
          Copy-Item -LiteralPath $msi[0].FullName -Destination "dist-native/deve-notebook-$env:VERSION-windows-x64.msi"
          Copy-Item -LiteralPath $nsis[0].FullName -Destination "dist-native/deve-notebook-$env:VERSION-windows-x64-setup.exe"
      - name: Seal and compare Windows package inputs
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          msi=(target/release/bundle/msi/*.msi)
          nsis=(target/release/bundle/nsis/*.exe)
          test ${#msi[@]} -eq 1 && test ${#nsis[@]} -eq 1
          cmp -- "${msi[0]}" "dist-native/deve-notebook-${VERSION}-windows-x64.msi"
          cmp -- "${nsis[0]}" "dist-native/deve-notebook-${VERSION}-windows-x64-setup.exe"
          (cd target/release && sha256sum deve_desktop.exe bundle/msi/*.msi bundle/nsis/*.exe >windows-smoke-input.sha256)
          (cd dist-native && sha256sum *.msi *.exe >windows-candidate-input.sha256)
      - name: Upload immutable Windows smoke input
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: deve-native-windows-input-${{ inputs.candidate_head }}
          path: |
            target/release/bundle/msi
            target/release/bundle/nsis
            target/release/deve_desktop.exe
            target/release/windows-smoke-input.sha256
          if-no-files-found: error
          retention-days: 14
      - name: Upload exact Windows candidate bytes
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: deve-native-windows-${{ inputs.candidate_head }}
          path: dist-native
          if-no-files-found: error
          retention-days: 14

  desktop-windows-local-smoke:
    needs: desktop-windows-build
    runs-on: windows-latest
    timeout-minutes: 180
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.candidate_head }}
          persist-credentials: false
      - name: Install Rust 1.97.0
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: "1.97.0"
      - name: Install Node.js 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - name: Install NSIS
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $nsis = "${env:ProgramFiles(x86)}\NSIS"
          if (!(Test-Path "$nsis\makensis.exe")) { choco install nsis -y --no-progress }
          Add-Content -Path $env:GITHUB_PATH -Value $nsis
      - name: Download immutable Windows smoke input
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: deve-native-windows-input-${{ inputs.candidate_head }}
          path: target/release
      - name: Verify immutable Windows smoke input
        run: (cd target/release && sha256sum -c windows-smoke-input.sha256)
      - name: Verify Windows Playwright process adapter
        shell: pwsh
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/playwright-core-process.test.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Windows PowerShell process adapter regression failed' }
          pwsh -NoProfile -File scripts/playwright-core-process.test.ps1
          if ($LASTEXITCODE -ne 0) { throw 'PowerShell process adapter regression failed' }
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/webview2-cdp.test.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Windows PowerShell WebView2 CDP regression failed' }
          pwsh -NoProfile -File scripts/webview2-cdp.test.ps1
          if ($LASTEXITCODE -ne 0) { throw 'PowerShell WebView2 CDP regression failed' }
          bash scripts/desktop-installer-windows.test.sh
      - name: Run Windows repo lifecycle and installed LocalBackend producers
        run: >-
          cargo run --locked -p deve_baseline -- acceptance-run
          --tier tag-ready
          --producer repo-lifecycle.process-windows
          --producer desktop.local-backend
          --receipt-dir "${{ runner.temp }}/deve-acceptance-desktop-local"
      - name: Upload Windows LocalBackend receipts
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: deve-acceptance-receipts-desktop-local-${{ inputs.candidate_head }}
          path: ${{ runner.temp }}/deve-acceptance-desktop-local
          if-no-files-found: error
          retention-days: 14

  desktop-windows-remote-smoke:
    needs: desktop-windows-build
    runs-on: windows-latest
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.candidate_head }}
          persist-credentials: false
      - name: Install Rust 1.97.0
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: "1.97.0"
      - name: Install Node.js 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - name: Download immutable Windows smoke input
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: deve-native-windows-input-${{ inputs.candidate_head }}
          path: target/release
      - name: Verify immutable Windows smoke input
        run: (cd target/release && sha256sum -c windows-smoke-input.sha256)
      - name: Download immutable exact Web projection
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.web_dist_artifact }}
          path: .
      - name: Verify exact Web projection input
        run: >-
          node scripts/web-dist-artifact.mjs verify
          --root apps/web/dist
          --manifest target/release-input/web-dist.json
          --expected-head "${{ inputs.candidate_head }}"
      - name: Install exact NSIS candidate for RemoteBrowser
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installers = @(Get-ChildItem target/release/bundle/nsis -Filter *.exe -File)
          if ($installers.Count -ne 1) { throw "expected one NSIS candidate, found $($installers.Count)" }
          $installRoot = Join-Path $env:RUNNER_TEMP 'deve-desktop-candidate-install'
          $workRoot = Join-Path $env:RUNNER_TEMP 'deve-desktop-candidate-work'
          Remove-Item -LiteralPath $installRoot -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item -LiteralPath $workRoot -Recurse -Force -ErrorAction SilentlyContinue
          $process = Start-Process -FilePath $installers[0].FullName -ArgumentList @('/S', "/D=$installRoot") -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "NSIS install failed: $($process.ExitCode)" }
          $marker = @{ schema = 1; marker = 'deve-desktop-remote-browser-smoke' } | ConvertTo-Json -Compress
          [IO.File]::WriteAllText((Join-Path $installRoot '.deve-desktop-install-root.json'), $marker, [Text.UTF8Encoding]::new($false))
          $binaries = @(Get-ChildItem $installRoot -Recurse -File | Where-Object { $_.Name -in @('deve_desktop.exe', 'Deve Notebook.exe') })
          if ($binaries.Count -ne 1) { throw "expected one installed Desktop binary, found $($binaries.Count)" }
          "DEVE_DESKTOP_BINARY=$($binaries[0].FullName)" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "DEVE_DESKTOP_REMOTE_INSTALL_ROOT=$installRoot" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "DEVE_DESKTOP_REMOTE_WORK_ROOT=$workRoot" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
      - name: Start exact-HEAD RemoteBrowser fixture
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cargo build --locked --release -p deve_cli
          if ($LASTEXITCODE -ne 0) { throw 'failed to build candidate backend' }
          cargo build --locked -p deve_baseline
          if ($LASTEXITCODE -ne 0) { throw 'failed to build password helper' }
          $headFile = Join-Path $env:RUNNER_TEMP 'deve-candidate-head.txt'
          [IO.File]::WriteAllText($headFile, $env:GITHUB_SHA, [Text.UTF8Encoding]::new($false))
          $stateRoot = Join-Path $env:RUNNER_TEMP 'deve-desktop-remote-fixture'
          & pwsh -NoProfile -File scripts/remote-browser-fixture-bounded-start.ps1 --state-dir $stateRoot --expected-head $env:GITHUB_SHA --backend-executable (Resolve-Path target/release/deve_cli.exe).Path --backend-head-file $headFile --password-hasher (Resolve-Path target/debug/deve_baseline.exe).Path --password-hasher-arg remote-fixture-password-hash
          if ($LASTEXITCODE -ne 0) { throw 'RemoteBrowser fixture failed to start' }
          $fixture = Get-Content -Raw -LiteralPath (Join-Path $stateRoot 'fixture-env.json') | ConvertFrom-Json
          $credentials = Get-Content -Raw -LiteralPath $fixture.credentials_file | ConvertFrom-Json
          Write-Output "::add-mask::$($credentials.username)"
          Write-Output "::add-mask::$($credentials.password)"
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "DEVE_DESKTOP_REMOTE_HTTPS_ORIGIN=$($fixture.https_origin)" -Encoding utf8
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "DEVE_DESKTOP_REMOTE_USERNAME=$($credentials.username)" -Encoding utf8
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "DEVE_DESKTOP_REMOTE_PASSWORD=$($credentials.password)" -Encoding utf8
      - name: Run exact installed RemoteBrowser and native recovery producer
        shell: pwsh
        run: >-
          cargo run --locked -p deve_baseline -- acceptance-run
          --tier target-host
          --producer desktop.remote-browser
          --receipt-dir "${{ runner.temp }}/deve-acceptance-desktop-remote"
      - name: Stop fixture and uninstall isolated candidate
        if: ${{ always() }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $failed = $false
          $stateRoot = Join-Path $env:RUNNER_TEMP 'deve-desktop-remote-fixture'
          if (Test-Path -LiteralPath (Join-Path $stateRoot 'fixture-state.json') -PathType Leaf) { pwsh -NoProfile -File scripts/remote-browser-fixture.ps1 stop --state-dir $stateRoot; if ($LASTEXITCODE -ne 0) { $failed = $true } }
          $installRoot = Join-Path $env:RUNNER_TEMP 'deve-desktop-candidate-install'
          if (Test-Path -LiteralPath $installRoot) {
            Remove-Item -LiteralPath (Join-Path $installRoot '.deve-desktop-install-root.json') -Force -ErrorAction SilentlyContinue
            $uninstallers = @(Get-ChildItem $installRoot -Recurse -File | Where-Object { $_.Name -match '^(uninstall|unins.*)\.exe$' })
            if ($uninstallers.Count -ne 1) { $failed = $true } else { $process = Start-Process -FilePath $uninstallers[0].FullName -ArgumentList '/S' -Wait -PassThru; if ($process.ExitCode -ne 0 -or (Test-Path -LiteralPath $installRoot)) { $failed = $true } }
          }
          if ($failed) { throw 'candidate fixture or install cleanup was incomplete' }
      - name: Upload Windows RemoteBrowser receipts
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: deve-acceptance-receipts-desktop-remote-${{ inputs.candidate_head }}
          path: ${{ runner.temp }}/deve-acceptance-desktop-remote
          if-no-files-found: error
          retention-days: 14

  desktop-macos-build:
    runs-on: macos-latest
    timeout-minutes: 120
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.candidate_head }}
          persist-credentials: false
      - name: Verify candidate identity and version
        env:
          EXPECTED_HEAD: ${{ inputs.candidate_head }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = 1 || { echo 'release candidate macOS runs are immutable; dispatch a fresh run instead of rerunning' >&2; exit 1; }
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$GITHUB_SHA" = "$EXPECTED_HEAD"
          scripts/check-release-version-match.sh "v$VERSION"
      - name: Install Rust 1.97.0
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: "1.97.0"
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - name: Install Node.js 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - name: Cache Cargo source inputs
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-candidate-macos-build-rust-1.97.0-${{ hashFiles('Cargo.lock') }}
      - name: Fetch locked Cargo inputs
        run: cargo fetch --locked
      - name: Install native packaging tools
        env:
          DEVE_NATIVE_INSTALL_TRUNK: "0"
          DEVE_NATIVE_INSTALL_TAURI_CLI: "1"
        run: scripts/install-native-target-host-tools.sh
      - name: Download immutable exact Web projection
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.web_dist_artifact }}
          path: .
      - name: Verify exact Web projection input
        run: >-
          node scripts/web-dist-artifact.mjs verify
          --root apps/web/dist
          --manifest target/release-input/web-dist.json
          --expected-head "${{ inputs.candidate_head }}"
      - name: Build exact macOS package once
        env:
          DEVE_DESKTOP_PACKAGE_BUILD_REQUIRED: "1"
          DEVE_DESKTOP_PACKAGE_BUNDLES: app,dmg
          DEVE_DESKTOP_PACKAGE_NO_SIGN: "1"
        run: scripts/check-desktop-platform-package-build.sh
      - name: Collect exact macOS candidate
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(target/release/bundle/dmg/*.dmg)
          test ${#files[@]} -eq 1
          case "$(uname -m)" in x86_64) arch=x64 ;; arm64) arch=arm64 ;; *) exit 1 ;; esac
          mkdir -p dist-native
          cp -- "${files[0]}" "dist-native/deve-notebook-${VERSION}-macos-${arch}.dmg"
          cmp -- "${files[0]}" "dist-native/deve-notebook-${VERSION}-macos-${arch}.dmg"
          (cd dist-native && shasum -a 256 *.dmg >macos-candidate-input.sha256)
      - name: Seal permission-preserving macOS smoke input
        run: |
          set -euo pipefail
          mkdir -p target/macos-smoke-input
          tar -C target/release/bundle -cpf target/macos-smoke-input/bundle.tar macos dmg
          (cd target/macos-smoke-input && shasum -a 256 bundle.tar >bundle.tar.sha256)
      - name: Upload immutable macOS smoke input
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: deve-native-macos-input-${{ inputs.candidate_head }}
          path: target/macos-smoke-input
          if-no-files-found: error
          retention-days: 14
      - name: Upload exact macOS candidate bytes
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: deve-native-macos-${{ inputs.candidate_head }}
          path: dist-native
          if-no-files-found: error
          retention-days: 14

  desktop-macos-smoke:
    needs: desktop-macos-build
    runs-on: macos-latest
    timeout-minutes: 135
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.candidate_head }}
          persist-credentials: false
      - name: Install Rust 1.97.0
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: "1.97.0"
      - name: Download immutable macOS smoke input
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: deve-native-macos-input-${{ inputs.candidate_head }}
          path: target/macos-smoke-input
      - name: Verify and extract bounded macOS smoke input
        run: |
          set -euo pipefail
          (cd target/macos-smoke-input && shasum -a 256 -c bundle.tar.sha256)
          while IFS= read -r entry; do
            [[ -n "$entry" && "$entry" != /* && "$entry" != *\\* ]]
            IFS=/ read -ra parts <<<"$entry"
            for part in "${parts[@]}"; do [[ "$part" != .. && "$part" != . && -n "$part" ]]; done
            [[ "${parts[0]}" == macos || "${parts[0]}" == dmg ]]
          done < <(tar -tf target/macos-smoke-input/bundle.tar)
          mkdir -p target/release/bundle
          tar -C target/release/bundle -xpf target/macos-smoke-input/bundle.tar
          test -d target/release/bundle/macos
          test -d target/release/bundle/dmg
      - name: Run exact macOS package producer without rebuilding
        run: >-
          cargo run --locked -p deve_baseline -- acceptance-run
          --tier target-host
          --producer desktop.macos-target-host
          --receipt-dir "${{ runner.temp }}/deve-acceptance-desktop-macos"
      - name: Upload macOS receipts
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: deve-acceptance-receipts-desktop-macos-${{ inputs.candidate_head }}
          path: ${{ runner.temp }}/deve-acceptance-desktop-macos
          if-no-files-found: error
          retention-days: 14

  mobile-android-apk-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      DEVE_MOBILE_PACKAGE_HOST_NATIVE_PACKAGING_CHECK: "0"
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.candidate_head }}
          persist-credentials: false
      - name: Verify candidate identity and version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = 1 || { echo 'release candidate Android runs are immutable; dispatch a fresh run instead of rerunning' >&2; exit 1; }
          test "$(git rev-parse HEAD)" = "${{ inputs.candidate_head }}"
          scripts/check-release-version-match.sh "v$VERSION"
      - name: Install Rust 1.97.0
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: "1.97.0"
          targets: x86_64-linux-android
      - name: Install Node.js 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - name: Install Java 17
        uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5
        with:
          distribution: temurin
          java-version: 17
      - name: Install native packaging tools
        env:
          DEVE_NATIVE_INSTALL_TRUNK: "0"
          DEVE_NATIVE_INSTALL_TAURI_CLI: "1"
        run: scripts/install-native-target-host-tools.sh
      - name: Download immutable exact Web projection
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.web_dist_artifact }}
          path: .
      - name: Verify exact Web projection input
        run: >-
          node scripts/web-dist-artifact.mjs verify
          --root apps/web/dist
          --manifest target/release-input/web-dist.json
          --expected-head "${{ inputs.candidate_head }}"
      - name: Build x86 release and debug journey APKs once
        env:
          DEVE_MOBILE_ANDROID_PACKAGE_BUILD_REQUIRED: "1"
          DEVE_MOBILE_ANDROID_PACKAGE_TARGET: x86_64
          DEVE_MOBILE_ANDROID_WEB_DIST_PREBUILT: "1"
        run: |
          DEVE_MOBILE_ANDROID_PACKAGE_DEBUG=0 scripts/check-mobile-android-shell-package-build.sh
          DEVE_MOBILE_ANDROID_PACKAGE_DEBUG=1 scripts/check-mobile-android-shell-package-build.sh
      - name: Seal Android APK input manifest
        run: |
          set -euo pipefail
          release_apk=apps/mobile/gen/android/app/build/outputs/apk/universal/release/app-universal-release-unsigned.apk
          debug_apk=apps/mobile/gen/android/app/build/outputs/apk/universal/debug/app-universal-debug.apk
          test -f "$release_apk" && test -f "$debug_apk"
          sha256sum "$release_apk" "$debug_apk" >target/android-apk-input.sha256
          bash scripts/android-prebuilt-apk-contract.test.sh
      - name: Upload immutable Android journey APKs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: deve-native-android-journey-input-${{ inputs.candidate_head }}
          path: |
            apps/mobile/gen/android/app/build/outputs/apk/universal/release/app-universal-release-unsigned.apk
            apps/mobile/gen/android/app/build/outputs/apk/universal/debug/app-universal-debug.apk
            target/android-apk-input.sha256
          if-no-files-found: error
          retention-days: 14

