name: Build and Smoke Native Candidate

# Build-only reusable workflow.  The caller owns candidate assembly and release
# promotion; this workflow never creates or mutates a GitHub Release.
on:
  workflow_call:
    inputs:
      version:
        description: Exact workspace version without a v prefix.
        required: true
        type: string
      candidate_head:
        description: Exact 40-character candidate commit.
        required: true
        type: string
    secrets:
      ANDROID_KEYSTORE_BASE64:
        required: true
      ANDROID_KEYSTORE_PASSWORD:
        required: true
      ANDROID_KEY_ALIAS:
        required: true
      ANDROID_KEY_PASSWORD:
        required: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  desktop-windows:
    runs-on: windows-latest
    timeout-minutes: 300
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.candidate_head }}
          persist-credentials: false

      - name: Verify candidate identity and version
        env:
          EXPECTED_HEAD: ${{ inputs.candidate_head }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_RUN_ATTEMPT" == 1 ]] || {
            echo 'release candidate Windows runs are immutable; dispatch a fresh run instead of rerunning' >&2
            exit 1
          }
          [[ "$(git rev-parse HEAD)" == "$EXPECTED_HEAD" ]]
          [[ "$GITHUB_SHA" == "$EXPECTED_HEAD" ]]
          scripts/check-release-version-match.sh "v$VERSION"

      - name: Install Rust 1.97.0
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: "1.97.0"
          targets: wasm32-unknown-unknown,x86_64-pc-windows-msvc

      - name: Install Node.js 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24

      - name: Cache Cargo inputs
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-candidate-native-${{ hashFiles('**/Cargo.lock') }}

      - name: Install native packaging tools
        env:
          DEVE_NATIVE_INSTALL_TRUNK: "1"
          DEVE_NATIVE_INSTALL_TAURI_CLI: "1"
        run: scripts/install-native-target-host-tools.sh

      - name: Install NSIS
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $nsis = "${env:ProgramFiles(x86)}\NSIS"
          if (!(Test-Path "$nsis\makensis.exe")) { choco install nsis -y --no-progress }
          if (!(Test-Path "$nsis\makensis.exe")) { throw "NSIS is unavailable at $nsis" }
          Add-Content -Path $env:GITHUB_PATH -Value $nsis

      - name: Verify Windows Playwright process adapter
        shell: pwsh
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/playwright-core-process.test.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Windows PowerShell process adapter regression failed' }
          pwsh -NoProfile -File scripts/playwright-core-process.test.ps1
          if ($LASTEXITCODE -ne 0) { throw 'PowerShell process adapter regression failed' }
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/webview2-cdp.test.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Windows PowerShell WebView2 CDP regression failed' }
          pwsh -NoProfile -File scripts/webview2-cdp.test.ps1
          if ($LASTEXITCODE -ne 0) { throw 'PowerShell WebView2 CDP regression failed' }
          bash scripts/desktop-installer-windows.test.sh; if ($LASTEXITCODE -ne 0) { throw 'Windows installer registry regression failed' }

      - name: Run Windows cross-process repo lifecycle producer
        run: >-
          cargo run --locked -p deve_baseline -- acceptance-run
          --tier tag-ready
          --producer repo-lifecycle.process-windows
          --receipt-dir "${{ runner.temp }}/deve-acceptance-desktop-repo-lifecycle"

      - name: Build exact Web projection
        run: scripts/build-web-dist-ci.sh

      - name: Run installed LocalBackend and NoteGit producer
        run: >-
          cargo run --locked -p deve_baseline -- acceptance-run
          --tier target-host
          --producer desktop.local-backend
          --receipt-dir "${{ runner.temp }}/deve-acceptance-desktop-local"

      - name: Install exact NSIS candidate for RemoteBrowser
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installers = @(Get-ChildItem target/release/bundle/nsis -Filter *.exe -File)
          if ($installers.Count -ne 1) { throw "expected one NSIS candidate, found $($installers.Count)" }
          $installRoot = Join-Path $env:RUNNER_TEMP 'deve-desktop-candidate-install'
          $workRoot = Join-Path $env:RUNNER_TEMP 'deve-desktop-candidate-work'
          Remove-Item -LiteralPath $installRoot -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item -LiteralPath $workRoot -Recurse -Force -ErrorAction SilentlyContinue
          $process = Start-Process -FilePath $installers[0].FullName -ArgumentList @('/S', "/D=$installRoot") -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "NSIS install failed: $($process.ExitCode)" }
          $marker = @{ schema = 1; marker = 'deve-desktop-remote-browser-smoke' } | ConvertTo-Json -Compress
          [IO.File]::WriteAllText((Join-Path $installRoot '.deve-desktop-install-root.json'), $marker, [Text.UTF8Encoding]::new($false))
          $binaries = @(Get-ChildItem $installRoot -Recurse -File | Where-Object { $_.Name -in @('deve_desktop.exe', 'Deve Notebook.exe') })
          if ($binaries.Count -ne 1) { throw "expected one installed Desktop binary, found $($binaries.Count)" }
          "DEVE_DESKTOP_BINARY=$($binaries[0].FullName)" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "DEVE_DESKTOP_REMOTE_INSTALL_ROOT=$installRoot" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "DEVE_DESKTOP_REMOTE_WORK_ROOT=$workRoot" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Start exact-HEAD RemoteBrowser fixture
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cargo build --locked --release -p deve_cli
          if ($LASTEXITCODE -ne 0) { throw 'failed to build candidate backend' }
          cargo build --locked -p deve_baseline
          if ($LASTEXITCODE -ne 0) { throw 'failed to build password helper' }
          $headFile = Join-Path $env:RUNNER_TEMP 'deve-candidate-head.txt'
          [IO.File]::WriteAllText($headFile, $env:GITHUB_SHA, [Text.UTF8Encoding]::new($false))
          $stateRoot = Join-Path $env:RUNNER_TEMP 'deve-desktop-remote-fixture'
          & pwsh -NoProfile -File scripts/remote-browser-fixture-bounded-start.ps1 `
            --state-dir $stateRoot `
            --expected-head $env:GITHUB_SHA `
            --backend-executable (Resolve-Path target/release/deve_cli.exe).Path `
            --backend-head-file $headFile `
            --password-hasher (Resolve-Path target/debug/deve_baseline.exe).Path `
            --password-hasher-arg remote-fixture-password-hash
          if ($LASTEXITCODE -ne 0) { throw 'RemoteBrowser fixture failed to start' }
          $fixture = Get-Content -Raw -LiteralPath (Join-Path $stateRoot 'fixture-env.json') | ConvertFrom-Json
          $credentials = Get-Content -Raw -LiteralPath $fixture.credentials_file | ConvertFrom-Json
          Write-Output "::add-mask::$($credentials.username)"
          Write-Output "::add-mask::$($credentials.password)"
          if ($credentials.auth_secret) { Write-Output "::add-mask::$($credentials.auth_secret)" }

      - name: Run exact installed RemoteBrowser and native recovery producer
        shell: pwsh
        run: |
          $stateRoot = Join-Path $env:RUNNER_TEMP 'deve-desktop-remote-fixture'
          $fixture = Get-Content -Raw -LiteralPath (Join-Path $stateRoot 'fixture-env.json') | ConvertFrom-Json
          $credentials = Get-Content -Raw -LiteralPath $fixture.credentials_file | ConvertFrom-Json
          $env:DEVE_DESKTOP_REMOTE_HTTPS_ORIGIN = $fixture.https_origin
          $env:DEVE_DESKTOP_REMOTE_USERNAME = $credentials.username
          $env:DEVE_DESKTOP_REMOTE_PASSWORD = $credentials.password
          cargo run --locked -p deve_baseline -- acceptance-run `
            --tier target-host `
            --producer desktop.remote-browser `
            --receipt-dir "${{ runner.temp }}/deve-acceptance-desktop-remote"
          if ($LASTEXITCODE -ne 0) { throw 'Desktop RemoteBrowser producer failed' }

      - name: Stop fixture and uninstall isolated candidate
        if: ${{ always() }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $failed = $false
          $stateRoot = Join-Path $env:RUNNER_TEMP 'deve-desktop-remote-fixture'
          if (Test-Path -LiteralPath (Join-Path $stateRoot 'fixture-state.json') -PathType Leaf) {
            pwsh -NoProfile -File scripts/remote-browser-fixture.ps1 stop --state-dir $stateRoot
            if ($LASTEXITCODE -ne 0) { $failed = $true }
          }
          $installRoot = Join-Path $env:RUNNER_TEMP 'deve-desktop-candidate-install'
          if ($installRoot -and (Test-Path -LiteralPath $installRoot)) {
            $marker = Join-Path $installRoot '.deve-desktop-install-root.json'
            Remove-Item -LiteralPath $marker -Force -ErrorAction SilentlyContinue
            $uninstallers = @(Get-ChildItem $installRoot -Recurse -File | Where-Object { $_.Name -match '^(uninstall|unins.*)\.exe$' })
            if ($uninstallers.Count -ne 1) { $failed = $true }
            else {
              $process = Start-Process -FilePath $uninstallers[0].FullName -ArgumentList '/S' -Wait -PassThru
              if ($process.ExitCode -ne 0 -or (Test-Path -LiteralPath $installRoot)) { $failed = $true }
            }
          }
          if ($failed) { throw 'candidate fixture or install cleanup was incomplete' }

      - name: Collect exact Windows candidates
        shell: pwsh
        env:
          VERSION: ${{ inputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Path dist-native -Force | Out-Null
          $msi = @(Get-ChildItem target/release/bundle/msi -Filter *.msi -File)
          $nsis = @(Get-ChildItem target/release/bundle/nsis -Filter *.exe -File)
          if ($msi.Count -ne 1 -or $nsis.Count -ne 1) { throw 'expected exactly one MSI and one NSIS candidate' }
          Copy-Item -LiteralPath $msi[0].FullName -Destination "dist-native/deve-notebook-$env:VERSION-windows-x64.msi"
          Copy-Item -LiteralPath $nsis[0].FullName -Destination "dist-native/deve-notebook-$env:VERSION-windows-x64-setup.exe"

      - name: Upload exact Windows candidate bytes
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: deve-native-windows-${{ inputs.candidate_head }}
          path: dist-native
          if-no-files-found: error
          retention-days: 14

      - name: Upload Windows receipts
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: deve-acceptance-receipts-desktop-${{ inputs.candidate_head }}
          path: ${{ runner.temp }}/deve-acceptance-desktop-*
          if-no-files-found: error
          retention-days: 14

  desktop-macos:
    runs-on: macos-latest
    timeout-minutes: 120
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.candidate_head }}
          persist-credentials: false

      - name: Verify candidate identity and version
        env:
          EXPECTED_HEAD: ${{ inputs.candidate_head }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_RUN_ATTEMPT" == 1 ]] || {
            echo 'release candidate macOS runs are immutable; dispatch a fresh run instead of rerunning' >&2
            exit 1
          }
          [[ "$(git rev-parse HEAD)" == "$EXPECTED_HEAD" ]]
          [[ "$GITHUB_SHA" == "$EXPECTED_HEAD" ]]
          scripts/check-release-version-match.sh "v$VERSION"

      - name: Install Rust 1.97.0
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: "1.97.0"
          targets: wasm32-unknown-unknown,aarch64-apple-darwin,x86_64-apple-darwin

      - name: Install Node.js 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24

      - name: Install native packaging tools
        env:
          DEVE_NATIVE_INSTALL_TRUNK: "1"
          DEVE_NATIVE_INSTALL_TAURI_CLI: "1"
        run: scripts/install-native-target-host-tools.sh

      - name: Build exact Web projection
        run: scripts/build-web-dist-ci.sh

      - name: Build and smoke exact macOS candidate
        run: >-
          cargo run --locked -p deve_baseline -- acceptance-run
          --tier target-host
          --producer desktop.macos-target-host
          --receipt-dir "${{ runner.temp }}/deve-acceptance-desktop-macos"

      - name: Collect exact macOS candidate
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(target/release/bundle/dmg/*.dmg)
          [[ ${#files[@]} -eq 1 ]]
          case "$(uname -m)" in
            x86_64) arch=x64 ;;
            arm64) arch=arm64 ;;
            *) echo "unsupported macOS runner architecture: $(uname -m)" >&2; exit 1 ;;
          esac
          mkdir -p dist-native
          cp -- "${files[0]}" "dist-native/deve-notebook-${VERSION}-macos-${arch}.dmg"

      - name: Upload exact macOS candidate bytes
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: deve-native-macos-${{ inputs.candidate_head }}
          path: dist-native
          if-no-files-found: error
          retention-days: 14

      - name: Upload macOS receipts
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: deve-acceptance-receipts-desktop-macos-${{ inputs.candidate_head }}
          path: ${{ runner.temp }}/deve-acceptance-desktop-macos
          if-no-files-found: error
          retention-days: 14

  mobile-android:
    runs-on: ubuntu-latest
    timeout-minutes: 210
    env:
      # Android packaging cross-compiles the native shell. Do not compile the
      # unrelated Linux GTK host surface during target-host preflight.
      DEVE_MOBILE_PACKAGE_HOST_NATIVE_PACKAGING_CHECK: "0"
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.candidate_head }}
          persist-credentials: false

      - name: Verify candidate identity, version, and signing inputs
        env:
          EXPECTED_HEAD: ${{ inputs.candidate_head }}
          VERSION: ${{ inputs.version }}
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_RUN_ATTEMPT" == 1 ]] || {
            echo 'release candidate Android runs are immutable; dispatch a fresh run instead of rerunning' >&2
            exit 1
          }
          [[ "$(git rev-parse HEAD)" == "$EXPECTED_HEAD" ]]
          [[ "$GITHUB_SHA" == "$EXPECTED_HEAD" ]]
          scripts/check-release-version-match.sh "v$VERSION"
          [[ -n "$KEYSTORE" && -n "$STORE_PASSWORD" && -n "$KEY_ALIAS" && -n "$KEY_PASSWORD" ]]

      - name: Install Rust 1.97.0
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: "1.97.0"
          targets: wasm32-unknown-unknown,x86_64-linux-android,aarch64-linux-android

      - name: Install Node.js 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24

      - name: Install Java 17
        uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5
        with:
          distribution: temurin
          java-version: 17

      - name: Enable Android emulator acceleration
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install native packaging tools
        env:
          DEVE_NATIVE_INSTALL_TRUNK: "1"
          DEVE_NATIVE_INSTALL_TAURI_CLI: "1"
        run: scripts/install-native-target-host-tools.sh

      - name: Build exact Web projection
        run: scripts/build-web-dist-ci.sh

      - name: Run API 29+ WebView 137+ LocalBackend writable lifecycle
        env:
          DEVE_MOBILE_ANDROID_EMULATOR_API_LEVEL: "37.0"
          DEVE_MOBILE_ANDROID_EMULATOR_SYSTEM_TARGET: google_apis
          DEVE_MOBILE_ANDROID_PACKAGE_TARGET: x86_64
        run: >-
          cargo run --locked -p deve_baseline -- acceptance-run
          --tier target-host
          --producer android.local-backend
          --receipt-dir "${{ runner.temp }}/deve-acceptance-android-local"

      - name: Start exact-HEAD Android RemoteBrowser fixture
        run: |
          set -euo pipefail
          cargo build --locked --release -p deve_cli
          cargo build --locked -p deve_baseline
          head_file="$RUNNER_TEMP/deve-android-candidate-head.txt"
          printf '%s' "$GITHUB_SHA" >"$head_file"
          bash scripts/remote-browser-fixture.sh start \
            --state-dir "$RUNNER_TEMP/deve-android-remote-fixture" \
            --expected-head "$GITHUB_SHA" \
            --backend-executable "$GITHUB_WORKSPACE/target/release/deve_cli" \
            --backend-head-file "$head_file" \
            --password-hasher "$GITHUB_WORKSPACE/target/debug/deve_baseline" \
            --password-hasher-arg remote-fixture-password-hash >/dev/null

      - name: Run RemoteBrowser writable lifecycle and native local recovery
        env:
          DEVE_MOBILE_ANDROID_EMULATOR_API_LEVEL: "37.0"
          DEVE_MOBILE_ANDROID_EMULATOR_SYSTEM_TARGET: google_apis
          DEVE_MOBILE_ANDROID_PACKAGE_TARGET: x86_64
        run: |
          set -euo pipefail
          fixture="$RUNNER_TEMP/deve-android-remote-fixture/fixture-env.json"
          credentials_file="$(jq -r .credentials_file "$fixture")"
          export DEVE_MOBILE_ANDROID_REMOTE_HTTPS_ORIGIN="$(jq -r .https_origin "$fixture")"
          export DEVE_MOBILE_ANDROID_REMOTE_USERNAME="$(jq -r .username "$credentials_file")"
          export DEVE_MOBILE_ANDROID_REMOTE_PASSWORD="$(jq -r .password "$credentials_file")"
          echo "::add-mask::$DEVE_MOBILE_ANDROID_REMOTE_USERNAME"
          echo "::add-mask::$DEVE_MOBILE_ANDROID_REMOTE_PASSWORD"
          cargo run --locked -p deve_baseline -- acceptance-run \
            --tier target-host \
            --producer android.remote-browser \
            --receipt-dir "$RUNNER_TEMP/deve-acceptance-android-remote"

      - name: Stop Android fixture and emulator
        if: ${{ always() }}
        run: |
          set +e
          status=0
          [[ ! -f "$RUNNER_TEMP/deve-android-remote-fixture/fixture-state.json" ]] || \
            bash scripts/remote-browser-fixture.sh stop --state-dir "$RUNNER_TEMP/deve-android-remote-fixture" || status=1
          bash scripts/cleanup-mobile-android-emulator.sh || status=1
          exit "$status"

      - name: Build final ARM64 APK
        env:
          DEVE_MOBILE_ANDROID_PACKAGE_BUILD_REQUIRED: "1"
          DEVE_MOBILE_ANDROID_PACKAGE_TARGET: aarch64
          DEVE_MOBILE_ANDROID_PACKAGE_APK: "1"
          DEVE_MOBILE_ANDROID_PACKAGE_AAB: "0"
        run: |
          set -euo pipefail
          rm -rf -- apps/mobile/gen/android/app/build/outputs/apk
          scripts/check-mobile-android-shell-package-build.sh

      - name: Sign and verify exact ARM64 APK
        env:
          VERSION: ${{ inputs.version }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          mapfile -d '' apks < <(find apps/mobile/gen/android/app/build/outputs/apk -path '*release*' -type f -name '*-unsigned.apk' -print0)
          [[ ${#apks[@]} -eq 1 ]] || { printf 'expected one unsigned ARM64 APK, found %s\n' "${#apks[@]}" >&2; exit 1; }
          buildtools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n1)"
          [[ -x "$buildtools/apksigner" && -x "$buildtools/zipalign" ]]
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode >"$RUNNER_TEMP/release.keystore"
          trap 'rm -f -- "$RUNNER_TEMP/release.keystore" "$RUNNER_TEMP/aligned.apk"' EXIT
          mkdir -p dist-native
          "$buildtools/zipalign" -f -p 4 "${apks[0]}" "$RUNNER_TEMP/aligned.apk"
          signed="dist-native/deve-notebook-${VERSION}-android-arm64.apk"
          "$buildtools/apksigner" sign \
            --ks "$RUNNER_TEMP/release.keystore" \
            --ks-pass env:ANDROID_KEYSTORE_PASSWORD \
            --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --key-pass env:ANDROID_KEY_PASSWORD \
            --out "$signed" "$RUNNER_TEMP/aligned.apk"
          "$buildtools/apksigner" verify --verbose --print-certs "$signed" | tee "$RUNNER_TEMP/apksigner.txt"
          signer="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' "$RUNNER_TEMP/apksigner.txt" | head -n1 | tr '[:upper:]' '[:lower:]')"
          [[ "$signer" =~ ^[0-9a-f]{64}$ ]]
          printf 'sha256:%s\n' "$signer" >dist-native/android-signer-sha256.txt

      - name: Upload exact signed Android candidate bytes
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: deve-native-android-${{ inputs.candidate_head }}
          path: dist-native
          if-no-files-found: error
          retention-days: 14

      - name: Upload Android receipts
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: deve-acceptance-receipts-android-${{ inputs.candidate_head }}
          path: ${{ runner.temp }}/deve-acceptance-android-*
          if-no-files-found: error
          retention-days: 14
