name: Release Native Packages

# Reusable native delivery track called by the tag-triggered release orchestrator.
#
# The Docker/Web release baseline stays in `release.yml`; this workflow is the
# native delivery track described in docs/plan/18_release.md §2.1. It builds
# installable desktop/mobile packages after the Docker release job succeeds and
# attaches them to one GitHub Release only after all required native builds pass,
# except Linux GTK3/WebKitGTK desktop artifacts, which ADR
# 0006 excludes from the first-tag release set. It reuses the same package-build scripts as
# `native-target-host.yml` (single source of truth for "how to build a package").
#
# Caveats (see docs/plan/18_release.md §1.1 / §2.1):
#   - Linux GTK3/WebKitGTK desktop bundles are intentionally not produced by
#     this first-tag delivery workflow. Reintroducing them requires reopening
#     ADR 0006 / release-audit warning blockers and refreshing target-host
#     evidence for the maintained native shell stack.
#   - Windows bundles ship UNSIGNED. SmartScreen will show an "unknown
#     publisher" prompt; this is expected for an unsigned open-source build.
#   - Android requires signing to install. The APK is signed only when the
#     keystore secrets below are configured; otherwise an UNSIGNED,
#     non-installable APK is uploaded for inspection only.
#   - Producing artifacts here does NOT by itself constitute Desktop/Mobile
#     "release readiness" (signing/store/physical-device acceptance are still
#     governed by 18_release §2.1).
#
# Optional repository secrets for a signed, installable Android APK
# (a local `keytool`-generated keystore is sufficient — no paid cert / store):
#   ANDROID_KEYSTORE_BASE64    base64 of a JKS/PKCS12 keystore
#   ANDROID_KEYSTORE_PASSWORD  keystore (store) password
#   ANDROID_KEY_ALIAS          key alias
#   ANDROID_KEY_PASSWORD       key password (often equal to the store password)

on:
  workflow_call:
    secrets:
      ANDROID_KEYSTORE_BASE64:
        required: false
      ANDROID_KEYSTORE_PASSWORD:
        required: false
      ANDROID_KEY_ALIAS:
        required: false
      ANDROID_KEY_PASSWORD:
        required: false

concurrency:
  group: release-native-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  # Mark semver prerelease tags (anything containing a hyphen, e.g. v1.0.0-rc.1)
  # as GitHub pre-releases.
  IS_PRERELEASE: ${{ contains(github.ref_name, '-') }}

jobs:
  desktop-windows:
    runs-on: windows-latest
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    env:
      DEVE_DESKTOP_TARGET_HOSTS: windows
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust 1.92
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.92"
          targets: wasm32-unknown-unknown,x86_64-pc-windows-msvc

      - name: Install Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-native-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-native-

      - name: Install native packaging tools (trunk + tauri CLI)
        env:
          DEVE_NATIVE_INSTALL_TRUNK: "1"
          DEVE_NATIVE_INSTALL_TAURI_CLI: "1"
        run: scripts/install-native-target-host-tools.sh

      - name: Install NSIS
        shell: pwsh
        run: |
          $nsis = "${env:ProgramFiles(x86)}\NSIS"
          if (!(Test-Path "$nsis\makensis.exe")) {
            choco install nsis -y --no-progress
          }
          if (!(Test-Path "$nsis\makensis.exe")) {
            throw "NSIS makensis.exe was not installed at $nsis"
          }
          Add-Content -Path $env:GITHUB_PATH -Value $nsis

      - name: Build web dist
        run: scripts/build-web-dist-ci.sh

      - name: Build Windows installers (msi, nsis; unsigned)
        env:
          DEVE_DESKTOP_PACKAGE_BUILD_REQUIRED: "1"
          DEVE_DESKTOP_PACKAGE_BUNDLES: msi,nsis
          DEVE_DESKTOP_PACKAGE_NO_SIGN: "1"
        run: scripts/check-desktop-platform-package-build.sh

      - name: Collect Windows installers
        run: |
          set -euo pipefail
          mkdir -p dist-release
          shopt -s nullglob
          copied=0
          for f in target/release/bundle/msi/*.msi target/release/bundle/nsis/*.exe; do
            cp "$f" dist-release/
            copied=$((copied + 1))
          done
          [ "$copied" -gt 0 ] || { echo "no Windows installers under target/release/bundle"; exit 1; }
          ls -la dist-release

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: deve-desktop-windows
          path: dist-release
          if-no-files-found: error

  mobile-android:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      DEVE_MOBILE_PACKAGE_TARGETS: android
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust 1.92
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.92"
          targets: wasm32-unknown-unknown,aarch64-linux-android,x86_64-linux-android

      - name: Install Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-native-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-native-

      - name: Set up Android SDK components (uses preinstalled SDK/NDK)
        run: |
          set -euo pipefail
          test -n "${ANDROID_HOME:-}"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platform-tools" "build-tools;34.0.0" >/dev/null

      - name: Install native packaging tools (trunk + tauri CLI)
        env:
          DEVE_NATIVE_INSTALL_TRUNK: "1"
          DEVE_NATIVE_INSTALL_TAURI_CLI: "1"
        run: scripts/install-native-target-host-tools.sh

      - name: Build web dist
        run: scripts/build-web-dist-ci.sh

      - name: Build Android APK (release, unsigned)
        env:
          DEVE_MOBILE_ANDROID_PACKAGE_BUILD_REQUIRED: "1"
          DEVE_MOBILE_ANDROID_PACKAGE_TARGET: aarch64
          DEVE_MOBILE_ANDROID_PACKAGE_APK: "1"
          DEVE_MOBILE_ANDROID_PACKAGE_AAB: "0"
        run: scripts/check-mobile-android-shell-package-build.sh

      - name: Sign / collect Android APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p dist-release
          unsigned="$(find apps/mobile/gen/android/app/build/outputs/apk -path '*release*' -name '*-unsigned.apk' -print -quit)"
          [ -n "$unsigned" ] || unsigned="$(find apps/mobile/gen/android/app/build/outputs/apk -path '*release*' -name '*.apk' -print -quit)"
          [ -n "$unsigned" ] || { echo "no release APK found under apps/mobile/gen/android/.../outputs/apk"; exit 1; }
          echo "release APK: $unsigned"

          if [ -n "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            buildtools="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n1)"
            echo "build-tools: $buildtools"
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            aligned="$RUNNER_TEMP/aligned.apk"
            signed="dist-release/deve-notebook-${VERSION}-android-arm64.apk"
            "$buildtools/zipalign" -f -p 4 "$unsigned" "$aligned"
            "$buildtools/apksigner" sign \
              --ks "$RUNNER_TEMP/release.keystore" \
              --ks-pass "pass:${ANDROID_KEYSTORE_PASSWORD}" \
              --ks-key-alias "${ANDROID_KEY_ALIAS}" \
              --key-pass "pass:${ANDROID_KEY_PASSWORD}" \
              --out "$signed" "$aligned"
            "$buildtools/apksigner" verify --verbose "$signed"
            echo "signed APK: $signed"
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 not set — uploading an UNSIGNED APK that cannot be installed. Configure the keystore secrets to ship an installable APK."
            cp "$unsigned" "dist-release/deve-notebook-${VERSION}-android-arm64-unsigned.apk"
          fi
          ls -la dist-release

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: deve-mobile-android
          path: dist-release
          if-no-files-found: error

  desktop-macos:
    runs-on: macos-latest
    permissions:
      contents: read
    env:
      DEVE_DESKTOP_TARGET_HOSTS: macos
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust 1.92
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.92"
          targets: wasm32-unknown-unknown,aarch64-apple-darwin,x86_64-apple-darwin

      - name: Install Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-native-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-native-

      - name: Install native packaging tools (trunk + tauri CLI)
        env:
          DEVE_NATIVE_INSTALL_TRUNK: "1"
          DEVE_NATIVE_INSTALL_TAURI_CLI: "1"
        run: scripts/install-native-target-host-tools.sh

      - name: Build web dist
        run: scripts/build-web-dist-ci.sh

      - name: Build macOS bundle (dmg; unsigned, not notarized)
        env:
          DEVE_DESKTOP_PACKAGE_BUILD_REQUIRED: "1"
          DEVE_DESKTOP_PACKAGE_BUNDLES: app,dmg
          DEVE_DESKTOP_PACKAGE_NO_SIGN: "1"
        run: scripts/check-desktop-platform-package-build.sh

      - name: Collect macOS dmg
        run: |
          set -euo pipefail
          mkdir -p dist-release
          shopt -s nullglob
          copied=0
          for f in target/release/bundle/dmg/*.dmg; do
            cp "$f" dist-release/
            copied=$((copied + 1))
          done
          [ "$copied" -gt 0 ] || { echo "no macOS dmg under target/release/bundle/dmg"; exit 1; }
          ls -la dist-release

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: deve-desktop-macos
          path: dist-release
          if-no-files-found: error

  publish:
    needs: [desktop-windows, mobile-android, desktop-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Windows artifacts
        uses: actions/download-artifact@v8
        with:
          name: deve-desktop-windows
          path: native-artifacts/windows

      - name: Download Android artifact
        uses: actions/download-artifact@v8
        with:
          name: deve-mobile-android
          path: native-artifacts/android

      - name: Download macOS artifact
        uses: actions/download-artifact@v8
        with:
          name: deve-desktop-macos
          path: native-artifacts/macos

      - name: Validate native artifact manifest
        shell: bash
        run: |
          set -euo pipefail

          mapfile -d '' downloaded_files < <(find native-artifacts -type f -print0)
          if [ "${#downloaded_files[@]}" -ne 4 ]; then
            echo "native artifacts: expected exactly four downloaded files, found ${#downloaded_files[@]}" >&2
            printf '  %s\n' "${downloaded_files[@]}" >&2
            exit 1
          fi

          collect_one() {
            local label="$1"
            local directory="$2"
            local pattern="$3"
            local matches=()
            mapfile -d '' matches < <(find "$directory" -maxdepth 1 -type f -name "$pattern" -print0)
            if [ "${#matches[@]}" -ne 1 ]; then
              echo "$label: expected exactly one '$pattern' file in $directory, found ${#matches[@]}" >&2
              return 1
            fi
            printf '%s' "${matches[0]}"
          }

          windows_msi="$(collect_one windows-msi native-artifacts/windows '*.msi')"
          windows_nsis="$(collect_one windows-nsis native-artifacts/windows '*.exe')"
          macos_dmg="$(collect_one macos-dmg native-artifacts/macos '*.dmg')"
          android_apk="$(collect_one android-arm64 native-artifacts/android 'deve-notebook-*-android-arm64*.apk')"

          mkdir -p dist-release
          declare -A seen=()
          for file in "$windows_msi" "$windows_nsis" "$macos_dmg" "$android_apk"; do
            name="${file##*/}"
            if [ -n "${seen[$name]+present}" ]; then
              echo "duplicate release asset basename: $name" >&2
              exit 1
            fi
            seen[$name]=1
            cp "$file" "dist-release/$name"
          done

          find dist-release -maxdepth 1 -type f -printf '%f\n' | sort > native-asset-manifest.txt
          [ "$(wc -l < native-asset-manifest.txt)" -eq 4 ]
          cat native-asset-manifest.txt

      - name: Require absent or draft GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          lookup_error="$RUNNER_TEMP/release-lookup.err"
          if existing_draft="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${GITHUB_REF_NAME}" --jq '.draft' 2>"$lookup_error")"; then
            [ "$existing_draft" = "true" ] || {
              echo "existing GitHub Release must be draft before asset upload" >&2
              exit 1
            }
          elif grep -q '(HTTP 404)' "$lookup_error"; then
            echo "no existing GitHub Release; a draft may be created"
          else
            cat "$lookup_error" >&2
            exit 1
          fi

      - name: Upload validated assets to a draft GitHub Release
        id: draft_release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist-release/*.msi
            dist-release/*.exe
            dist-release/*.dmg
            dist-release/deve-notebook-*-android-arm64*.apk
          draft: true
          prerelease: ${{ env.IS_PRERELEASE }}
          generate_release_notes: true
          fail_on_unmatched_files: true

      - name: Verify draft assets and publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release_state="$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq '.isDraft')"
          [ "$release_state" = "true" ] || { echo "release must remain draft before asset verification" >&2; exit 1; }

          gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name' | sort > uploaded-asset-manifest.txt
          diff -u native-asset-manifest.txt uploaded-asset-manifest.txt

          publish_args=(--draft=false)
          if [ "$IS_PRERELEASE" = "true" ]; then
            publish_args+=(--prerelease)
          else
            publish_args+=(--prerelease=false --latest)
          fi
          gh release edit "$GITHUB_REF_NAME" "${publish_args[@]}"

          release_state="$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq '.isDraft')"
          [ "$release_state" = "false" ] || { echo "release remained draft after publish" >&2; exit 1; }
          gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name' | sort > published-asset-manifest.txt
          diff -u native-asset-manifest.txt published-asset-manifest.txt
