[package]
name = "deve_cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
default-run = "deve"
autobins = false

[[bin]]
name = "deve_cli"
path = "src/main.rs"

[[bin]]
name = "deve"
path = "src/bin/deve.rs"

[[bin]]
name = "mock_divergence"
path = "src/bin/mock_divergence.rs"

[dependencies]
deve_core.workspace = true
tokio.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
clap = { version = "4.4", features = ["derive"] }
axum = { version = "0.7", features = ["ws"] }
axum-extra = { version = "0.9", features = ["cookie"] }
tower = { version = "0.4", features = ["util"] }
tower-http = { version = "0.5", features = ["cors", "fs", "trace"] }
futures = "0.3"
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
toml = "0.5"
redb.workspace = true
chrono = { version = "0.4", features = ["serde"] }
hmac = "0.12"
sha2 = "0.10"
getrandom.workspace = true
rhai = { version = "1.19", features = ["serde", "sync"] }
uuid.workspace = true
ctrlc = "3.4"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls-webpki-roots", "stream"] }
tokio-tungstenite = "0.24"
quick-xml = "0.41.0"
unicode-normalization = "0.1"
dotenvy = "0.15"

[dev-dependencies]
tempfile = "3.24"
tokio = { workspace = true, features = ["test-util"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[features]
default = []
search = ["deve_core/search"]
