[package]
name = "deve_mobile"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[features]
default = []
native-packaging = [
  "dep:deve_cli",
  "dep:block2",
  "dep:getrandom",
  "dep:indexmap_1",
  "dep:jni",
  "dep:objc2",
  "dep:objc2-core-foundation",
  "dep:objc2-foundation",
  "dep:objc2-ui-kit",
  "dep:reqwest",
  "dep:tauri",
  "dep:tauri-build",
  "dep:tokio",
  "tauri/wry",
]

[lib]
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
deve_cli = { path = "../cli", optional = true }
deve_core.workspace = true
getrandom = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
reqwest = { version = "0.12", optional = true, default-features = false, features = ["json", "rustls-tls-webpki-roots"] }
# Tauri's schema path reaches schemars 0.8 -> indexmap 1.x; Linux native packaging
# needs indexmap/std explicit because indexmap 1.x only auto-detects std via autocfg.
indexmap_1 = { package = "indexmap", version = "1.9.3", optional = true, default-features = false, features = ["std"] }
tauri = { version = "2.11.1", optional = true, default-features = false, features = [] }
tokio = { workspace = true, optional = true }

[target.'cfg(target_os = "android")'.dependencies]
jni = { version = "0.21", optional = true }

[target.'cfg(target_os = "ios")'.dependencies]
block2 = { version = "0.6.2", optional = true, default-features = false }
objc2 = { version = "0.6.4", optional = true, default-features = false }
objc2-core-foundation = { version = "0.3.2", optional = true, default-features = false, features = ["objc2"] }
objc2-foundation = { version = "0.3.2", optional = true, default-features = false, features = ["std", "NSString"] }
objc2-ui-kit = { version = "0.3.2", optional = true, default-features = false, features = [
  "std",
  "block2",
  "objc2-core-foundation",
  "UIAction",
  "UIButton",
  "UIControl",
  "UIImage",
  "UIMenuElement",
  "UIResponder",
  "UIView",
  "UIViewController",
] }

[build-dependencies]
indexmap_1 = { package = "indexmap", version = "1.9.3", optional = true, default-features = false, features = ["std"] }
tauri-build = { version = "2.6.1", optional = true, default-features = false, features = [] }
