[package]
name = "deve_desktop"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[features]
default = []
native-packaging = [
  "dep:indexmap_1",
  "dep:reqwest",
  "dep:tauri",
  "dep:tauri-build",
  "dep:windows-sys",
  "tauri/tray-icon",
  "tauri/wry",
]

[dependencies]
deve_core.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
getrandom.workspace = true
reqwest = { version = "0.12", optional = true, default-features = false, features = ["json", "rustls-tls-webpki-roots"] }
# Tauri's schema path reaches schemars 0.8 -> indexmap 1.x; Linux native packaging
# needs indexmap/std explicit because indexmap 1.x only auto-detects std via autocfg.
indexmap_1 = { package = "indexmap", version = "1.9.3", optional = true, default-features = false, features = ["std"] }
tauri = { version = "2.11.1", optional = true, default-features = false, features = [] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", optional = true, default-features = false, features = ["Win32_Foundation", "Win32_System_Console", "Win32_System_JobObjects", "Win32_System_Threading"] }

[build-dependencies]
indexmap_1 = { package = "indexmap", version = "1.9.3", optional = true, default-features = false, features = ["std"] }
tauri-build = { version = "2.6.1", optional = true, default-features = false, features = [] }
