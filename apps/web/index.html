    <script>
      (() => {
        const normalizeThemePref = (value) => {
          switch (value) {
            case "warm":
            case "cold":
            case "night":
              return value;
            case "dark":
              return "night";
            case "auto":
            case "light":
              return "warm";
            default:
              return "warm";
          }
        };

        // Always set the marker pre-paint (default warm) so the first paint
        // carries data-deve-theme-pref and its color-scheme, even before any
        // theme is stored. normalizeThemePref(null) resolves to "warm".
        let stored = null;
        try {
          stored = window.localStorage?.getItem("deve.ui.theme");
        } catch (_) {
          // localStorage can be unavailable in private or restricted contexts.
        }
        document.documentElement.setAttribute(
          "data-deve-theme-pref",
          normalizeThemePref(stored),
        );
      })();
    </script>

    <script>
      // 0. Global Error Handler
      const registerIndexBridgeGlobal = (name, value, meta = {}) => {
        const bridge = window.__deveWebBridge;
        if (!bridge || typeof bridge.register !== "function") {
          throw new Error(`web bridge registry unavailable before registering ${name}`);
        }
        return bridge.register(name, value, {
          runtime: "widget_bridge_runtime",
          source: "index-boot-bootstrap",
          authority: "none",
          ...meta,
        });
      };

      registerIndexBridgeGlobal("__DEVE_DEBUG_OVERLAY__", false, {
        role: "boot-debug-flag",
      });

      registerIndexBridgeGlobal("showOverlay", () => {
        const el = document.getElementById("loading-overlay");
        if (!el) return;
        el.classList.remove("hidden");
        el.style.display = "flex";
      }, { role: "boot-overlay-show" });

      registerIndexBridgeGlobal("setBootPanel", (title, detail, tone = "info") => {
        const panel = document.getElementById("boot-panel");
        const titleEl = document.getElementById("boot-panel-title");
        const detailEl = document.getElementById("boot-panel-detail");
        if (!panel || !titleEl || !detailEl) return;
        if (tone !== "error") {
          panel.style.display = "none";
          return;
        }
        panel.style.display = "block";
        panel.className =
          "fixed top-4 left-4 z-[var(--z-toast)] max-w-lg rounded-xl border border-red-400 bg-red-50 px-4 py-3 text-red-900 shadow-lg";
        titleEl.textContent = title;
        detailEl.textContent = detail;
      }, { role: "boot-error-panel-set" });

      registerIndexBridgeGlobal("hideBootPanel", () => {
        const panel = document.getElementById("boot-panel");
        if (!panel) return;
        panel.style.display = "none";
      }, { role: "boot-error-panel-hide" });

      registerIndexBridgeGlobal("hideOverlay", () => {
        const el = document.getElementById("loading-overlay");
        if (!el) return;
        el.classList.add("hidden");
        el.style.display = "none";
      }, { role: "boot-overlay-hide" });

      registerIndexBridgeGlobal("logToOverlay", (msg, isError = false) => {
        const el = document.getElementById("loading-overlay");
        if (el && (isError || window.__DEVE_DEBUG_OVERLAY__)) {
          if (isError) window.showOverlay();
          const line = document.createElement("div");
          if (isError) line.style.color = "red";
          line.innerText = msg;
          el.appendChild(line);
        }
        if (isError) {
          console.error("[Overlay]", msg);
          window.setBootPanel("Boot Error", msg, "error");
        } else if (window.__DEVE_DEBUG_OVERLAY__) {
          console.log("[Overlay]", msg);
        }
      }, { role: "boot-overlay-log" });

      window.addEventListener("error", function (event) {
        const msg = event.message || String(event.error || "unknown error");
        const line = event.lineno ?? 0;
        const col = event.colno ?? 0;
        window.logToOverlay(`Global Error: ${msg} @ ${line}:${col}`, true);
      });

      window.addEventListener("unhandledrejection", function (event) {
        window.logToOverlay(`Unhandled Rejection: ${event.reason}`, true);
      });

      const registerEditorBridgeGlobal = (name, value, meta = {}) => {
        const bridge = window.__deveWebBridge;
        if (!bridge || typeof bridge.register !== "function") {
          throw new Error(`web bridge registry unavailable before registering ${name}`);
        }
        return bridge.register(name, value, {
          runtime: "render_projection_runtime",
          source: "index-editor-bootstrap",
          authority: "none",
          ...meta,
        });
      };

      // 1. Synchronous Bridge (Queue Logic only)
      window._editor_queue = [];
      window._pending_editor_actions = [];
      window._cm_loaded = false;
      window._editor_bridge_ready = false;

      registerEditorBridgeGlobal("queueEditorAction", (kind, payload) => {
        window._pending_editor_actions.push({ kind, payload });
        if (window._pending_editor_actions.length > 256) {
          window._pending_editor_actions.shift();
        }
      }, { role: "editor-bootstrap-queue" });

      registerEditorBridgeGlobal("queueEditorMount", (element, onUpdate) => {
        window._editor_queue = [{ element, onUpdate }];
      }, { role: "editor-bootstrap-mount-queue" });

      // Rust calls this immediately, so we queue it until Modules are loaded
      registerEditorBridgeGlobal("setupCodeMirror", function (element, onUpdate) {
        window.logToOverlay("Rust called setupCodeMirror");
        if (window._cm_loaded && window._realInit) {
          window._realInit(element, onUpdate);
        } else {
          window.queueEditorMount(element, onUpdate);
          if (window.ensureEditorAdapter) {
            window.ensureEditorAdapter();
          }
        }
      }, { role: "wasm-editor-mount" });

      // Safety Stubs
      registerEditorBridgeGlobal("applyRemoteContent", (text) => {
        window.queueEditorAction("content", String(text ?? ""));
      }, { role: "wasm-editor-snapshot" });
      registerEditorBridgeGlobal("applyRemoteOp", (opJson) => {
        window.queueEditorAction("op", String(opJson ?? ""));
      }, { role: "wasm-editor-op" });
      registerEditorBridgeGlobal("applyRemoteOpsBatch", (opsJson) => {
        return false;
      }, { role: "wasm-editor-op-batch" });
      registerEditorBridgeGlobal("getEditorContent", () => "", { role: "wasm-editor-query" });
      registerEditorBridgeGlobal("scrollGlobal", () => {}, {
        runtime: "widget_bridge_runtime",
        role: "wasm-editor-navigation",
      });
      registerEditorBridgeGlobal("updateGutterDiff", () => {}, {
        runtime: "widget_bridge_runtime",
        role: "wasm-editor-diff-projection",
      });
      registerEditorBridgeGlobal("setReadOnly", (readOnly) => {
        window.queueEditorAction("readOnly", !!readOnly);
      }, { role: "wasm-editor-readonly" });
      registerEditorBridgeGlobal("destroyEditor", () => {
        window._editor_bridge_ready = false;
        window._pending_editor_actions = [];
      }, { role: "wasm-editor-lifecycle" });

      registerEditorBridgeGlobal("mobileInsertText", (text) => {
        const view = window._debug_view;
        if (!view || typeof text !== "string") return false;
        if (view.state?.readOnly) return false;
        const sel = view.state.selection.main;
        view.dispatch({
          changes: { from: sel.from, to: sel.to, insert: text },
          selection: { anchor: sel.from + text.length },
        });
        view.focus();
        return true;
      }, { runtime: "widget_bridge_runtime", role: "wasm-editor-mobile-input" });

      registerEditorBridgeGlobal("mobileWrapSelection", (prefix, suffix) => {
        const view = window._debug_view;
        if (!view) return false;
        if (view.state?.readOnly) return false;
        const sel = view.state.selection.main;
        const p = String(prefix || "");
        const s = String(suffix || "");
        const selected = view.state.sliceDoc(sel.from, sel.to);
        const insert = `${p}${selected}${s}`;
        const anchor = selected.length > 0 ? sel.from + insert.length : sel.from + p.length;
        view.dispatch({
          changes: { from: sel.from, to: sel.to, insert },
          selection: { anchor },
        });
        view.focus();
        return true;
      }, { runtime: "widget_bridge_runtime", role: "wasm-editor-mobile-input" });

      registerEditorBridgeGlobal("mobileUndo", () => {
        const view = window._debug_view;
        if (!view) return false;
        if (view.state?.readOnly) return false;
        view.focus();
        try {
          if (document.queryCommandSupported?.("undo")) {
            document.execCommand("undo");
            return true;
          }
        } catch (_) {}
        const isMac = /Mac|iPhone|iPad/i.test(navigator.platform || "");
        const evt = new KeyboardEvent("keydown", {
          key: "z",
          bubbles: true,
          ctrlKey: !isMac,
          metaKey: isMac,
        });
        view.contentDOM.dispatchEvent(evt);
        return true;
      }, { runtime: "widget_bridge_runtime", role: "wasm-editor-history" });

      registerEditorBridgeGlobal("mobileRedo", () => {
        const view = window._debug_view;
        if (!view) return false;
        if (view.state?.readOnly) return false;
        view.focus();
        try {
          if (document.queryCommandSupported?.("redo")) {
            document.execCommand("redo");
            return true;
          }
        } catch (_) {}
        const isMac = /Mac|iPhone|iPad/i.test(navigator.platform || "");
        const evt = new KeyboardEvent("keydown", {
          key: isMac ? "z" : "y",
          bubbles: true,
          ctrlKey: !isMac,
          metaKey: isMac,
          shiftKey: isMac,
        });
        view.contentDOM.dispatchEvent(evt);
        return true;
      }, { runtime: "widget_bridge_runtime", role: "wasm-editor-history" });
    </script>

    <!-- 3. Module Initialization -->
    <script src="js/init.js"></script>
    <script type="module">
      window.logToOverlay("Module Script Started. Adapter will lazy-load on demand.");

      const registerEditorBridgeGlobal = (name, value, meta = {}) => {
        const bridge = window.__deveWebBridge;
        if (!bridge || typeof bridge.register !== "function") {
          throw new Error(`web bridge registry unavailable before registering ${name}`);
        }
        return bridge.register(name, value, {
          runtime: "render_projection_runtime",
          source: "index-editor-adapter",
          authority: "none",
          ...meta,
        });
      };

      const attachEditorAdapter = (module) => {
        const {
          initCodeMirror,
          applyRemoteContent,
          applyRemoteOp,
          applyRemoteOpsBatch,
          getEditorContent,
          syncEditorStateToRust,
          scrollGlobal,
          setReadOnly,
          destroyEditor,
          updateGutterDiff,
          getEditorSelection,
        } = module;

        const rawApplyRemoteOp = (opJson) => {
          applyRemoteOp(opJson);
        };
        const rawApplyRemoteOpsBatch =
          applyRemoteOpsBatch ||
          ((opsJson) => {
            try {
              const ops = JSON.parse(opsJson);
              if (!Array.isArray(ops)) return false;
              for (const op of ops) {
                if (!op || (!op.Insert && !op.Delete)) return false;
                rawApplyRemoteOp(JSON.stringify(op));
              }
              return true;
            } catch (e) {
              console.error("applyRemoteOpsBatch Fallback Error:", e);
              return false;
            }
          });
        const rawSetReadOnly = (readOnly) => {
          setReadOnly(readOnly);
        };
        const rawDestroyEditor = () => {
          destroyEditor();
        };
        const replayEditorAction = (action) => {
          switch (action.kind) {
            case "content":
              applyRemoteContent(action.payload);
              break;
            case "op":
              rawApplyRemoteOp(action.payload);
              break;
            case "opsBatch":
              if (rawApplyRemoteOpsBatch(action.payload) !== true) {
                console.warn("Queued editor ops batch replay failed");
              }
              break;
            case "readOnly":
              rawSetReadOnly(action.payload);
              break;
            default:
              break;
          }
        };

        registerEditorBridgeGlobal("applyRemoteContent", (text) => {
          if (!window._editor_bridge_ready) {
            window.queueEditorAction("content", String(text ?? ""));
            return;
          }
          applyRemoteContent(text);
        }, { role: "wasm-editor-snapshot" });
        registerEditorBridgeGlobal("applyRemoteOp", (opJson) => {
          if (!window._editor_bridge_ready) {
            window.queueEditorAction("op", String(opJson ?? ""));
            return;
          }
          rawApplyRemoteOp(opJson);
        }, { role: "wasm-editor-op" });
        registerEditorBridgeGlobal("applyRemoteOpsBatch", (opsJson) => {
          if (!window._editor_bridge_ready) {
            return false;
          }
          return rawApplyRemoteOpsBatch(opsJson) === true;
        }, { role: "wasm-editor-op-batch" });
        registerEditorBridgeGlobal("getEditorContent", getEditorContent, { role: "wasm-editor-query" });
        registerEditorBridgeGlobal("scrollGlobal", scrollGlobal, {
          runtime: "widget_bridge_runtime",
          role: "wasm-editor-navigation",
        });
        registerEditorBridgeGlobal("setReadOnly", (readOnly) => {
          if (!window._editor_bridge_ready) {
            window.queueEditorAction("readOnly", !!readOnly);
            return;
          }
          rawSetReadOnly(readOnly);
        }, { role: "wasm-editor-readonly" });
        registerEditorBridgeGlobal("destroyEditor", () => {
          window._editor_bridge_ready = false;
          window._pending_editor_actions = [];
          rawDestroyEditor();
        }, { role: "wasm-editor-lifecycle" });
        registerEditorBridgeGlobal("updateGutterDiff", updateGutterDiff || (() => {}), {
          runtime: "widget_bridge_runtime",
          role: "wasm-editor-diff-projection",
        });
        registerEditorBridgeGlobal("getEditorSelection", getEditorSelection || (() => "null"), {
          role: "wasm-editor-selection",
        });

        if (typeof initCodeMirror !== "function") {
          throw new Error(
            "initCodeMirror is not a function in exported module!",
          );
        }

        window.logToOverlay("Adapter imported successfully.");

        window._realInit = (element, onUpdate) => {
          window.logToOverlay("Initializing Editor View");
          window.hideOverlay();

          try {
            initCodeMirror(element, onUpdate);
            window._editor_bridge_ready = true;
            rawSetReadOnly(true);
            if (window._pending_editor_actions.length > 0) {
              const pending = window._pending_editor_actions.slice();
              window._pending_editor_actions = [];
              window.logToOverlay(
                `Replaying ${pending.length} queued editor actions...`,
              );
              pending.forEach(replayEditorAction);
            }
            syncEditorStateToRust?.();
          } catch (e) {
            window.logToOverlay("Init call failed: " + e.message, true);
            throw e;
          }
        };

        // The adapter bundle registers a raw mount function at module top-level.
        // Re-route later mounts through the bootstrap wrapper so queue replay and
        // readiness state still work after editor remounts.
        registerEditorBridgeGlobal("setupCodeMirror", (element, onUpdate) => {
          window.logToOverlay("Rust called setupCodeMirror");
          if (window._realInit) {
            window._realInit(element, onUpdate);
            return;
          }
          window.queueEditorMount(element, onUpdate);
          if (window.ensureEditorAdapter) {
            window.ensureEditorAdapter();
          }
        }, { role: "wasm-editor-mount" });

        window._cm_loaded = true;

        if (window._editor_queue.length > 0) {
          const pendingMounts = window._editor_queue.slice();
          const latestMount = pendingMounts[pendingMounts.length - 1];
          window.logToOverlay(
            `Flushing latest editor mount from ${pendingMounts.length} queued item(s)...`,
          );
          window._realInit(latestMount.element, latestMount.onUpdate);
          window._editor_queue = [];
        }
      };

      registerEditorBridgeGlobal("ensureEditorAdapter", () => {
        if (window._cm_loaded) {
          return Promise.resolve();
        }
        if (window._adapter_loading) {
          return window._adapter_loading;
        }

        window.setBootPanel(
          "Loading Editor Adapter",
          "Editor requested CodeMirror. Loading adapter bundle now.",
          "success",
        );
        window.logToOverlay("Lazy-loading editor adapter bundle...");

        window._adapter_loading = import("./js/editor.bundle.js?rev=20260703-heading-lineheight")
          .then((module) => {
            attachEditorAdapter(module);
          })
          .catch((e) => {
            console.error("Failed to load editor adapter:", e);
            window.logToOverlay(
              "Failed to load editor adapter: " + e.message,
              true,
            );
            if (e.stack) window.logToOverlay(e.stack, true);
            throw e;
          })
          .finally(() => {
            if (!window._cm_loaded) {
              window._adapter_loading = null;
            }
          });

        return window._adapter_loading;
      }, { runtime: "widget_bridge_runtime", role: "editor-adapter-loader" });

      window.addEventListener("TrunkApplicationStarted", () => {
        if (window.__DEVE_DEBUG_OVERLAY__) {
          console.log("[Overlay]", "TrunkApplicationStarted event received.");
        }
      }, { once: true });
    </script>
  </head>
  <body>
    <div
      id="boot-panel"
      class="fixed top-4 left-4 z-[var(--z-toast)] max-w-lg rounded-xl border border-sky-400 bg-sky-50 px-4 py-3 text-sky-950 shadow-lg"
      style="display: none; font: 13px/1.4 ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;"
    >
      <div id="boot-panel-title" style="font-weight: 700; margin-bottom: 4px;">
        Boot Error
      </div>
      <div id="boot-panel-detail">
        Unexpected boot failure.
      </div>
    </div>
    <div
      id="loading-overlay"
      class="hidden"
      style="display: none; flex-direction: column; padding: 20px"
    >
      <div style="font-size: 1.2em; font-weight: bold; margin-bottom: 10px">
        Initializing Hybrid Components...
      </div>
    </div>
  </body>
