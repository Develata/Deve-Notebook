<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#1e1e1e" />
    <title>Deve-Note</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="manifest" href="/manifest.json" />
    <link data-trunk rel="copy-file" href="public/favicon.svg" data-target-path="." />
    <link data-trunk rel="copy-file" href="public/manifest.json" data-target-path="." />
    <script>
      (() => {
        const normalizeThemePref = (value) => {
          switch (value) {
            case "warm":
            case "cold":
            case "night":
              return value;
            case "dark":
              return "night";
            case "auto":
            case "light":
              return "warm";
            default:
              return "warm";
          }
        };

        // Always set the marker pre-paint (default warm) so the first paint
        // carries data-deve-theme-pref and its color-scheme, even before any
        // theme is stored. normalizeThemePref(null) resolves to "warm".
        let stored = null;
        try {
          stored = window.localStorage?.getItem("deve.ui.theme");
        } catch (_) {
          // localStorage can be unavailable in private or restricted contexts.
        }
        document.documentElement.setAttribute(
          "data-deve-theme-pref",
          normalizeThemePref(stored),
        );
      })();
    </script>
    <link data-trunk rel="tailwind-css" href="style/tailwind.css" />
    <link data-trunk rel="css" href="style/_variables.css" />
    <link data-trunk rel="css" href="style/_variables-cold.css" />
    <link data-trunk rel="css" href="style/_variables-night.css" />
    <link data-trunk rel="css" href="style/_base.css" />
    <link data-trunk rel="css" href="style/_blockquote.css" />
    <link data-trunk rel="css" href="style/_code-block.css" />
    <link data-trunk rel="css" href="style/_math.css" />
    <link data-trunk rel="css" href="style/_typography.css" />
    <link data-trunk rel="css" href="style/_widgets.css" />
    <link data-trunk rel="css" href="style/_selection.css" />
    <link data-trunk rel="copy-dir" href="js" />
    <link data-trunk rel="copy-dir" href="public/katex" />
    <script src="katex/katex.min.js"></script>
    <link rel="stylesheet" href="katex/katex.min.css" />
    <script src="katex/contrib/copy-tex.min.js"></script>
    <script src="js/web_bridge_registry.js"></script>
    <script src="js/katex_bridge.js"></script>
    <script src="js/chat_math_bootstrap.js"></script>
    <script src="js/chat_math.js"></script>
    <script type="module" src="js/native_backend_bridge.bundle.js"></script>
    <script src="js/index_bootstrap.js"></script>
    <script src="js/init.js"></script>
    <script type="module" src="js/index_editor_adapter.js"></script>
  </head>
  <body>
    <div
      id="boot-panel"
      class="fixed top-4 left-4 z-[var(--z-toast)] max-w-lg rounded-xl border border-sky-400 bg-sky-50 px-4 py-3 text-sky-950 shadow-lg"
      style="display: none; font: 13px/1.4 ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;"
    >
      <div id="boot-panel-title" style="font-weight: 700; margin-bottom: 4px;">
        Boot Error
      </div>
      <div id="boot-panel-detail">
        Unexpected boot failure.
      </div>
    </div>
    <div
      id="loading-overlay"
      class="hidden"
      style="display: none; flex-direction: column; padding: 20px"
    >
      <div style="font-size: 1.2em; font-weight: bold; margin-bottom: 10px">
        Initializing Hybrid Components...
      </div>
    </div>
  </body>
</html>
