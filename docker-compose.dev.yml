# Deve-Notebook local build Docker Compose
# Use this when testing the local Dockerfile instead of the published OCI image.

services:
  deve-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: deve-server-dev
    restart: unless-stopped
    ports:
      - "3001:3001"
    volumes:
      - deve-dev-data:/data
      - deve-dev-notes:/notes
    environment:
      DEVE_BIND_ADDR: 0.0.0.0:3001
      DEVE_LEDGER_DIR: /data/ledger
      AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET to at least 32 random bytes}
      AUTH_USER: ${AUTH_USER:-admin}
      AUTH_PASS: ${AUTH_PASS:?set AUTH_PASS to an Argon2 PHC password hash}
    mem_limit: 512m
    deploy:
      resources:
        limits:
          memory: 512m
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:3001/api/node/role"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  deve-dev-data: {}
  deve-dev-notes: {}
