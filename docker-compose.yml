# Deve-Notebook production Docker Compose
# This file mirrors docs/plan/15_release.md: run the published OCI image,
# keep data under ./data, and fail closed unless production auth material is set.

services:
  deve-server:
    image: ghcr.io/develata/deve-notebook:latest
    container_name: deve-server
    restart: always
    ports:
      - "3001:3001"
    volumes:
      - ./data:/data
      - ./notes:/notes
    environment:
      DEVE_BIND_ADDR: 0.0.0.0:3001
      DEVE_LEDGER_DIR: /data/ledger
      AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET to at least 32 random bytes}
      AUTH_USER: ${AUTH_USER:-admin}
      AUTH_PASS: ${AUTH_PASS:?set AUTH_PASS to an Argon2 PHC password hash}
    mem_limit: 512m
    deploy:
      resources:
        limits:
          memory: 512m
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:3001/api/node/role"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
