# Deve-Notebook Docker Compose 配置
# 用途：开发和部署环境的单服务配置
# 目标环境：768MB VPS（内存限制留出 OS 运行空间）

services:
  # Deve 笔记服务器主服务
  deve-server:
    # 使用本地 Dockerfile 构建镜像
    build:
      context: .
      dockerfile: Dockerfile
    
    # 容器名称
    container_name: deve-note
    
    # 端口映射：宿主机 3001 -> 容器 3001
    ports:
      - "3001:3001"
    
    # 环境变量配置
    environment:
      # Vault 数据存储路径（容器内）
      DEVE_VAULT_PATH: /data/vault
      # 服务器绑定地址和端口
      DEVE_BIND_ADDR: 0.0.0.0:3001
    
    # 数据卷：deve-data 命名卷挂载到容器 /data 目录
    volumes:
      - deve-data:/data
    
    # 重启策略：容器异常退出时自动重启（除非主动停止）
    restart: unless-stopped
    
    # 资源限制：内存上限 512MB（低资源环境优化）
    # mem_limit: compose v2 兼容；deploy.resources: Swarm 兼容
    mem_limit: 512m
    deploy:
      resources:
        limits:
          memory: 512m
    
    # 健康检查（与 Dockerfile 保持一致）
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:3001/api/node/role"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

# 命名卷定义：持久化存储 vault 数据
volumes:
  deve-data: {}
