# Deve-Note Configuration

# Application Profile (standard | low-spec)
profile = "standard"

# Path Configuration
# Local ledger storage (contains database and logs)
ledger_dir = "ledger"
# Root directory for your documents
vault_path = "vault"

# P2P Sync Mode (auto | manual)
sync_mode = "auto"

# Performance Tuning
# Number of changes to keep in history
snapshot_depth = 100
# Background compression concurrency
concurrency = 4

[ai]
mode = "native"
native_enabled = true

[ai.agent_bridge]
enabled = false
trusted = false
timeout_ms = 30000
