# Deve-Notebook Configuration

# Application Profile (standard | low-spec)
profile = "standard"

# Path Configuration
# Local ledger storage (contains database and logs)
ledger_dir = "ledger"
# Optional absolute base used only when a zero-repo host creates its first repo.
# repo_creation_projection_base = "C:/Users/example/Documents/Deve-Notebook"
# Projection workspace roots are configured per repo with:
# deve repo projection set --repo <name-or-uuid> --base <path>

# P2P Sync Mode (auto | manual)
sync_mode = "auto"

# Merge Strategy (manual | auto)
merge_strategy = "manual"

# Performance Tuning
# Number of changes to keep in history
snapshot_depth = 100
# Memory cache limit in MB
mem_cache_mb = 128
# Background compression concurrency
concurrency = 4

[p2p]
enabled = false
inbound_token_env = "DEVE_P2P_INBOUND_TOKEN"
connect_interval_ms = 5000
# [[p2p.peers]]
# label = "peer-b"
# peer_id = "<12-lowercase-hex-peer-id-from-peer-b-startup-log>"
# repo_id = "11111111-1111-1111-1111-111111111111"
# ws_url = "ws://127.0.0.1:3102/ws"
# auth_token_env = "DEVE_P2P_PEER_B_TOKEN"
# enabled = true

[ui]
locale = "auto"
theme = "warm"
sidebar_visible = true
statusbar_visible = true
outline_visible = true
outline_width = 260
sidebar_width = 250
right_panel_width = 350
outer_gutter = 16
recent_commands_count = 3
recent_docs_count = 10

[ai]
mode = "native"
native_enabled = true

[ai.agent_bridge]
enabled = false
trusted = false
timeout_ms = 30000
